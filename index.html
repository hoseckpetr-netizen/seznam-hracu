<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seznam hráčů – FK Slovany Pardubice</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { --accent: #00FFFF; --bg: #0b0d10; --card: #1a1e23; --border: #262b31; --text: #eef1f3; --muted: #9aa2ab; --green: #34D399; --red: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; flex-shrink: 0; background: #0e1114; border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #06181a; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
    .brand .name { font-weight: 600; font-size: 14px; }
    .brand .icons { display: none; }
    .icon-btn { width: 36px; height: 36px; border-radius: 9px; background: var(--card); border: 1px solid var(--border); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; }
    .icon-btn:disabled { opacity: .45; cursor: default; }
    .season { font-size: 11px; color: var(--muted); }
    .cat-list { display: flex; flex-direction: column; gap: 2px; }
    .cat-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); border: 1px solid transparent; }
    .cat-item.active { background: rgba(0,255,255,0.1); border-color: var(--accent); color: var(--text); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .role-badge { margin-top: auto; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .role-badge button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-family: inherit; font-size: 11px; padding: 0; }
    .main { flex: 1; padding: 24px 28px; overflow-y: auto; min-width: 0; }
    .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .header h1 { font-size: 20px; margin: 0; }
    .header .count { font-size: 13px; color: var(--muted); }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    select, input[type=search] { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 12px; }
    .loading { padding: 60px; text-align: center; color: var(--muted); }

    /* Player list (card rows) */
    .player-list { display: flex; flex-direction: column; gap: 8px; }
    .player-card { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px; cursor: pointer; transition: border-color .15s ease; text-decoration: none; color: inherit; }
    .player-card:hover { border-color: var(--accent); }
    .ring { position: relative; width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; }
    .ring .ring-hole { position: absolute; inset: 3px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; }
    .pc-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pc-birth { width: 100px; flex-shrink: 0; text-align: center; font-size: 12px; color: var(--muted); }
    .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }

    /* Detail view */
    .detail-back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500; cursor: pointer; background: none; border: none; padding: 0; margin-bottom: 18px; font-family: inherit; }
    .detail-back:hover { color: var(--accent); }
    .detail-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .detail-head .ring { width: 60px; height: 60px; }
    .detail-head .ring .ring-hole { font-size: 15px; }
    .detail-name { font-size: 19px; font-weight: 600; }
    .detail-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .detail-progress { font-size: 12px; color: var(--accent); font-weight: 500; margin-top: 3px; }
    .detail-grid { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .info-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 280px; }
    .info-box .box-title { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
    .info-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
    .info-row span:first-child { color: var(--muted); flex-shrink: 0; }
    .info-row a { color: var(--text); text-decoration: none; }
    .info-row a:hover { color: var(--accent); }
    .checklist-row { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-bottom: 1px solid #20242a; }
    .checklist-row:last-child { border-bottom: none; }
    .checklist-row .cl-label { flex: 1; font-size: 12px; }
    .cl-icon { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .cl-icon.on { background: rgba(52,211,153,0.15); color: var(--green); }
    .cl-icon.off { background: rgba(248,113,113,0.15); color: var(--red); }
    .phase-note { font-size: 11px; color: #5a6169; padding-top: 4px; }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Sign-in screen */
    .signin-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; text-align: center; padding: 20px; }
    .signin-screen .logo { width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: #06181a; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
    .signin-screen h1 { font-size: 18px; margin: 0; }
    .signin-screen p { color: var(--muted); font-size: 13px; max-width: 360px; margin: 0; }
    .gsi-btn-wrap { margin-top: 6px; }
    .signin-error { color: var(--red); font-size: 13px; max-width: 360px; }

    @media (max-width: 760px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: column; align-items: stretch; padding: 12px 14px 10px; gap: 10px; }
      .brand { width: 100%; }
      .brand .icons { display: flex; gap: 8px; margin-left: auto; }
      .sidebar .season { display: none; }
      .cat-list { flex-direction: row; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
      .cat-item { white-space: nowrap; flex-shrink: 0; border-radius: 999px; padding: 8px 14px; border: 1px solid var(--border); background: var(--card); }
      .cat-item.active { background: rgba(0,255,255,0.13); border-color: var(--accent); }
      .role-badge { display: none; }
      .main { padding: 14px 12px; }
      .header h1 { font-size: 17px; }
      .filters { flex-direction: column; }
      .filters input, .filters select { width: 100%; }
      .pc-birth { width: 62px; font-size: 10px; }
      .detail-grid { flex-direction: column; }
      .info-box { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <div id="signinScreen" class="signin-screen">
    <div class="logo">FKS</div>
    <h1>Seznam hráčů – FK Slovany Pardubice</h1>
    <p>Pro přístup se přihlaste svým Google účtem, který má sdílený přístup k tabulce Seznam hráčů.</p>
    <div class="gsi-btn-wrap" id="gsiBtnWrap">
      <button class="icon-btn" style="width:auto;padding:10px 20px;font-size:13px;" id="manualSigninBtn" type="button" onclick="signIn()">Přihlásit se přes Google</button>
    </div>
    <div class="signin-error" id="signinError"></div>
  </div>

  <div class="app" id="appRoot" style="display:none;">
    <div class="sidebar">
      <div class="brand">
        <div class="logo">FKS</div><div class="name">Seznam hráčů</div>
        <div class="icons">
          <button class="icon-btn" type="button" onclick="focusSearch()" aria-label="Hledat" title="Hledat hráče">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="icon-btn" type="button" disabled aria-label="Mapa hráčů" title="Mapa hráčů — připravujeme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          </button>
          <button class="icon-btn" type="button" disabled aria-label="Nastavení" title="Nastavení — připravujeme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
        </div>
      </div>
      <div class="season" id="season">Načítám…</div>
      <div class="cat-list" id="catList"></div>
      <div class="role-badge" id="roleBadge"></div>
    </div>
    <div class="main" id="main">
      <div class="loading" id="loadingMsg">Načítám data ze Sheetu…</div>
    </div>
  </div>

<script>
  // ---------- Config ----------
  var CLIENT_ID = '263192844228-8e8inbfjl1shvsiont4jhmme8c53l6ef.apps.googleusercontent.com';
  var SPREADSHEET_ID = '1U9sNUiZj63o027eDi64bc02GsCR6gDx8yCgfADM-rvc';
  var SCOPES = 'https://www.googleapis.com/auth/spreadsheets.readonly https://www.googleapis.com/auth/userinfo.email';
  var ADMIN_EMAILS = ['hoseck.petr@gmail.com'];
  var VIEWER_EMAILS = ['fkslovany@gmail.com'];
  var CHECKLIST_KEYS = ['REG KIS','KONTAKTY','EMAIL','WHATSAPP','KIS SOUP','CASH KIS','REG FAČR','CASH FAČR','ČL KLUBU','HR KLUBU','FOTO PC','FOTO FAČR','SOUHL KIS','PL. JARO'];
  var CATEGORY_COLORS = {
    'Muži': '#94A3B8', 'U19': '#FB7185', 'U17': '#FB923C', 'U15': '#A78BFA',
    'U13': '#F472B6', 'U12': '#F97316', 'U11': '#FBBF24', 'U10': '#4ADE80',
    'U9': '#34D399', 'U7': '#38BDF8', 'Mini': '#38BDF8', 'Minipřípravka': '#38BDF8'
  };
  var CHECKLIST_LABELS = {
    'REG KIS': 'Registrace KIS', 'KONTAKTY': 'Kontakty', 'EMAIL': 'E-mail', 'WHATSAPP': 'WhatsApp',
    'KIS SOUP': 'KIS soupiska', 'CASH KIS': 'Platba KIS', 'REG FAČR': 'Registrace FAČR',
    'CASH FAČR': 'Platba FAČR', 'ČL KLUBU': 'Člen klubu', 'HR KLUBU': 'Hráč klubu',
    'FOTO PC': 'Foto (PC)', 'FOTO FAČR': 'Foto FAČR', 'SOUHL KIS': 'Souhlas KIS', 'PL. JARO': 'Platba jaro'
  };

  var DATA = null;
  var state = { category: 'Vše', rok: 'Vše', city: 'Vše', q: '', view: 'list', selectedRow: null };
  var tokenClient = null;
  var accessToken = null;

  window.onerror = function(msg, src, line, col, err) {
    var el = document.getElementById('main');
    if (el) { el.innerHTML = '<div class="loading">Chyba skriptu: ' + String(msg) + ' (řádek ' + line + ')</div>'; }
  };

  // ---------- Google Identity Services sign-in ----------
  function gisReady() { return window.google && google.accounts && google.accounts.oauth2; }

  function ensureTokenClient() {
    if (tokenClient) return tokenClient;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: function(resp) {
        if (resp.error) {
          document.getElementById('signinError').textContent = 'Přihlášení selhalo: ' + resp.error;
          return;
        }
        accessToken = resp.access_token;
        afterSignIn();
      }
    });
    return tokenClient;
  }

  function signIn() {
    document.getElementById('signinError').textContent = '';
    if (!gisReady()) {
      document.getElementById('signinError').textContent = 'Google přihlašovací služba se ještě načítá, zkuste to prosím za chvíli znovu.';
      return;
    }
    ensureTokenClient().requestAccessToken({ prompt: 'select_account' });
  }

  function signOut() {
    if (accessToken && window.google && google.accounts && google.accounts.oauth2) {
      google.accounts.oauth2.revoke(accessToken, function() {});
    }
    accessToken = null;
    DATA = null;
    document.getElementById('appRoot').style.display = 'none';
    document.getElementById('signinScreen').style.display = 'flex';
    document.getElementById('signinError').textContent = '';
  }

  function afterSignIn() {
    document.getElementById('signinScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'flex';
    loadData();
  }

  // ---------- Helpers (ported from Apps Script SeznamApp.gs) ----------
  function esc(s) {
    return (s === null || s === undefined) ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function initials(name) {
    return (name || '').split(' ').filter(Boolean).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
  }

  function findHeaderRowIndex_(values, mustContain) {
    for (var r = 0; r < Math.min(values.length, 12); r++) {
      if (values[r].indexOf(mustContain) !== -1) return r;
    }
    throw new Error('Hlavičkový řádek s "' + mustContain + '" nebyl nalezen.');
  }

  function buildColumnMap_(headerRow) {
    var map = {};
    headerRow.forEach(function (h, i) {
      var name = (h || '').toString().trim();
      if (!name) return;
      if (!map[name]) map[name] = [];
      map[name].push(i);
    });
    return map;
  }

  function col_(map, name, occurrence) {
    occurrence = occurrence || 0;
    return (map[name] && map[name].length > occurrence) ? map[name][occurrence] : -1;
  }

  function val_(row, idx) {
    return (idx >= 0 && row[idx] !== undefined) ? row[idx] : '';
  }

  // Finds a header column whose (trimmed) text CONTAINS substr — used for the
  // "Zákonný zástupce" header, which in the real sheet is not an exact match
  // (it's appended to a long note in the same cell), so an exact-key lookup
  // in buildColumnMap_ silently fails and returns -1.
  function findColBySubstring_(headerRow, substr) {
    for (var i = 0; i < headerRow.length; i++) {
      var name = (headerRow[i] || '').toString().trim();
      if (name.indexOf(substr) !== -1) return i;
    }
    return -1;
  }

  function parseRoster_(values, sheetName) {
    var headerRowIdx = findHeaderRowIndex_(values, 'Příjmení');
    var header = values[headerRowIdx];
    var map = buildColumnMap_(header);

    // The "Zákonný zástupce" header cell in the real sheet holds a long note
    // text ending in "...Zákonný zástupce", not an exact "Zákonný zástupce"
    // string, so it must be found by substring — not via buildColumnMap_'s
    // exact-key lookup (col_ with 'Zákonný zástupce' always returned -1).
    // The Telefon/E-mail for the zástupce are the two columns immediately
    // to its right (confirmed against the real header layout).
    var zastupceJmenoIdx = findColBySubstring_(header, 'Zákonný zástupce');

    var idx = {
      prijmeni: col_(map, 'Příjmení'),
      jmeno: col_(map, 'Jméno', 0),
      datumPridani: col_(map, sheetName === 'Vyřazené' ? 'Datum vyřazení' : 'Datum přidání'),
      rok: col_(map, 'Rok'),
      kategorie: col_(map, 'Kategorie'),
      datumNarozeni: col_(map, 'Datum narození (M,D,R)'),
      vek: col_(map, 'Věk'),
      pohlavi: col_(map, 'Pohlaví'),
      ulice: col_(map, 'Ulice'),
      cp: col_(map, 'čp'),
      mesto: col_(map, 'Město'),
      psc: col_(map, 'PSČ'),
      emailHrac: col_(map, 'E-mail', 0),
      telefonHrac: col_(map, 'Telefon', 0),
      id: col_(map, 'ID'),
      zastupceJmeno: zastupceJmenoIdx,
      zastupceTelefon: zastupceJmenoIdx >= 0 ? zastupceJmenoIdx + 1 : -1,
      zastupceEmail: zastupceJmenoIdx >= 0 ? zastupceJmenoIdx + 2 : -1
    };

    var players = [];
    for (var r = headerRowIdx + 1; r < values.length; r++) {
      var row = values[r];
      var prijmeni = val_(row, idx.prijmeni);
      var jmeno = val_(row, idx.jmeno);
      if (!prijmeni && !jmeno) continue;

      var checklist = {};
      CHECKLIST_KEYS.forEach(function (key) {
        var ci = col_(map, key);
        checklist[key] = ci >= 0 ? (row[ci] === true) : false;
      });

      players.push({
        sheetRow: r + 1,
        prijmeni: prijmeni,
        jmeno: jmeno,
        jmenoCele: (jmeno + ' ' + prijmeni).trim(),
        datumPridani: val_(row, idx.datumPridani),
        rok: val_(row, idx.rok),
        kategorie: val_(row, idx.kategorie),
        datumNarozeni: val_(row, idx.datumNarozeni),
        vek: val_(row, idx.vek),
        pohlavi: val_(row, idx.pohlavi),
        ulice: val_(row, idx.ulice),
        cp: val_(row, idx.cp),
        mesto: val_(row, idx.mesto),
        psc: val_(row, idx.psc),
        emailHrac: val_(row, idx.emailHrac),
        telefonHrac: val_(row, idx.telefonHrac),
        id: val_(row, idx.id),
        zastupceJmeno: val_(row, idx.zastupceJmeno),
        zastupceTelefon: val_(row, idx.zastupceTelefon),
        zastupceEmail: val_(row, idx.zastupceEmail),
        checklist: checklist
      });
    }
    return players;
  }

  function parseCategoryRules_(values) {
    if (!values || !values.length) return [];
    var bestCol = -1, bestYear = -1;
    var headerRow = values[0] || [];
    headerRow.forEach(function (v, i) {
      var m = /^(\d{4})-(\d{4})$/.exec((v || '').toString().trim());
      if (m) {
        var y = parseInt(m[1], 10);
        if (y > bestYear) { bestYear = y; bestCol = i; }
      }
    });
    if (bestCol === -1) return [];

    var rules = [];
    for (var r = 2; r < values.length; r++) {
      var od = values[r][bestCol];
      var doo = values[r][bestCol + 1];
      var label = (values[r][bestCol + 2] || '').toString().trim();
      if (!label) continue;
      rules.push({
        id: 'kat' + r,
        label: label,
        from: Number(od) || null,
        to: Number(doo) || null
      });
    }
    return rules;
  }

  function colorForLabel_(label) {
    if (CATEGORY_COLORS[label]) return CATEGORY_COLORS[label];
    var hash = 0;
    for (var i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) % 360;
    return 'hsl(' + hash + ', 65%, 60%)';
  }

  function matchCategoryRule_(rok, rules) {
    var r = Number(rok);
    for (var i = 0; i < rules.length; i++) {
      var rule = rules[i];
      if (rule.from == null && rule.to == null) continue;
      var lo = (rule.from != null) ? rule.from : -Infinity;
      var hi = (rule.to != null) ? rule.to : Infinity;
      if (r >= lo && r <= hi) return rule;
    }
    return null;
  }

  // ---------- Data loading (Sheets API v4, direct from browser) ----------
  function loadData() {
    document.getElementById('main').innerHTML = '<div class="loading">Načítám data ze Sheetu…</div>';
    var slowTimer = setTimeout(function() {
      var el = document.getElementById('main');
      if (el && el.querySelector('.loading')) {
        el.innerHTML = '<div class="loading">Stále se načítá…</div>';
      }
    }, 6000);

    fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { 'Authorization': 'Bearer ' + accessToken }
    }).then(function(r) { return r.json(); }).then(function(userinfo) {
      var email = (userinfo.email || '').toLowerCase();
      var role = ADMIN_EMAILS.indexOf(email) !== -1 ? 'admin' : (VIEWER_EMAILS.indexOf(email) !== -1 ? 'viewer' : null);
      if (!role) {
        clearTimeout(slowTimer);
        document.getElementById('main').innerHTML = '<div class="loading">Přístup odepřen.<br>Účet ' + esc(email) + ' nemá k appce přístup. Pokud si myslíte, že jde o omyl, napište Petrovi.<br><br><button id="signoutBtn" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;">Odhlásit a zkusit jiný účet</button></div>';
        var so = document.getElementById('signoutBtn');
        if (so) so.addEventListener('click', signOut);
        return;
      }

      var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID +
        '/values:batchGet?ranges=Seznam&ranges=Kategorie&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING';

      return fetch(url, { headers: { 'Authorization': 'Bearer ' + accessToken } })
        .then(function(r) {
          if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
          return r.json();
        })
        .then(function(json) {
          clearTimeout(slowTimer);
          var seznamValues = (json.valueRanges[0] && json.valueRanges[0].values) || [];
          var kategorieValues = (json.valueRanges[1] && json.valueRanges[1].values) || [];

          var players = parseRoster_(seznamValues, 'Seznam');
          var rules = parseCategoryRules_(kategorieValues);
          var rulesWithColor = rules.map(function (r) {
            return { id: r.id, label: r.label, from: r.from, to: r.to, color: colorForLabel_(r.label) };
          });

          players.forEach(function (p) {
            var rule = matchCategoryRule_(p.rok, rulesWithColor);
            p.categoryGroup = rule ? rule.label : (p.kategorie || 'Nezařazeno');
            p.categoryColor = rule ? rule.color : colorForLabel_(p.kategorie || 'Nezařazeno');
          });

          var cities = {};
          players.forEach(function (p) { if (p.mesto) cities[p.mesto] = true; });

          DATA = {
            players: players,
            categoryRules: rulesWithColor,
            cities: Object.keys(cities).sort(),
            season: 'Seznam hráčů 26/27',
            role: role
          };

          document.getElementById('season').textContent = DATA.season;
          document.getElementById('roleBadge').innerHTML = '<span>' + (role === 'admin' ? 'Přihlášen jako správce' : 'Přihlášen jako náhled') + '</span><button onclick="signOut()">Odhlásit</button>';
          renderCatList();
          render();
        });
    }).catch(function(err) {
      clearTimeout(slowTimer);
      document.getElementById('main').innerHTML = '<div class="loading">Chyba: ' + esc(err.message) + '<br><br><button id="retryBtn" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;">Zkusit znovu</button></div>';
      var btn = document.getElementById('retryBtn');
      if (btn) { btn.addEventListener('click', loadData); }
    });
  }

  function focusSearch() {
    var el = document.getElementById('search');
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.focus(); }
  }

  function checklistCounts(p) {
    var keys = Object.keys(p.checklist);
    var done = keys.filter(function(k){ return p.checklist[k]; }).length;
    return { done: done, total: keys.length };
  }

  function ringStyle(pct, color) {
    return 'background:conic-gradient(' + (color || 'var(--accent)') + ' ' + pct + '%, var(--border) ' + pct + '% 100%);';
  }

  function filteredPlayers() {
    return DATA.players.filter(function(p) {
      if (state.category !== 'Vše' && p.categoryGroup !== state.category) return false;
      if (state.rok !== 'Vše' && String(p.rok) !== state.rok) return false;
      if (state.city !== 'Vše' && p.mesto !== state.city) return false;
      if (state.q && p.jmenoCele.toLowerCase().indexOf(state.q.toLowerCase()) === -1) return false;
      return true;
    });
  }

  function openDetail(sheetRow) {
    state.view = 'detail';
    state.selectedRow = sheetRow;
    render();
  }

  function backToList() {
    state.view = 'list';
    state.selectedRow = null;
    render();
  }

  function renderListView() {
    var players = filteredPlayers();
    var rows = players.map(function(p) {
      var c = checklistCounts(p);
      var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
      return '<div class="player-card" onclick="openDetail(' + p.sheetRow + ')">' +
        '<div class="ring" style="' + ringStyle(pct, esc(p.categoryColor)) + '"><div class="ring-hole">' + esc(initials(p.jmenoCele)) + '</div></div>' +
        '<span class="pc-name">' + esc(p.jmenoCele) + '</span>' +
        '<span class="pc-birth">' + esc(p.datumNarozeni) + (p.vek ? ' · ' + esc(p.vek) + ' let' : '') + '</span>' +
        '<span class="chip"><span class="dot" style="background:' + esc(p.categoryColor) + '"></span>' + esc(p.categoryGroup) + '</span>' +
      '</div>';
    }).join('');

    return '<div class="header"><h1>Aktivní hráči</h1><div class="count">' + players.length + ' z ' + DATA.players.length + ' hráčů</div></div>' +
      '<div class="filters">' +
        '<input type="search" id="search" placeholder="Hledat jméno…" value="' + esc(state.q) + '">' +
        '<select id="rokFilter"></select>' +
        '<select id="cityFilter"></select>' +
      '</div>' +
      '<div class="player-list">' + (rows || '<div class="loading">Žádní hráči neodpovídají filtru.</div>') + '</div>';
  }

  function renderDetailView() {
    var p = DATA.players.find(function(x){ return x.sheetRow === state.selectedRow; });
    if (!p) { state.view = 'list'; return renderListView(); }
    var c = checklistCounts(p);
    var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;

    var checklistRows = Object.keys(p.checklist).map(function(key) {
      var on = p.checklist[key];
      var label = CHECKLIST_LABELS[key] || key;
      return '<div class="checklist-row">' +
        '<span class="cl-label">' + esc(label) + '</span>' +
        '<span class="cl-icon ' + (on ? 'on' : 'off') + '">' + (on ? '&#10003;' : '&#10005;') + '</span>' +
      '</div>';
    }).join('');

    var addressLine = [p.ulice, p.cp].filter(Boolean).join(' ') + (p.mesto ? (p.ulice || p.cp ? ', ' : '') + p.mesto : '') + (p.psc ? ' ' + p.psc : '');

    return '<button class="detail-back" onclick="backToList()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Zpět na seznam</button>' +
      '<div class="detail-head">' +
        '<div class="ring" style="' + ringStyle(pct, esc(p.categoryColor)) + '"><div class="ring-hole">' + esc(initials(p.jmenoCele)) + '</div></div>' +
        '<div>' +
          '<div class="detail-name">' + esc(p.jmenoCele) + '</div>' +
          '<div class="detail-sub"><span class="dot" style="background:' + esc(p.categoryColor) + '"></span>' + esc(p.categoryGroup) + ' · ' + esc(p.kategorie) + ' · narozen ' + esc(p.datumNarozeni) + (p.vek ? ' · ' + esc(p.vek) + ' let' : '') + '</div>' +
          '<div class="detail-progress">' + c.done + '/' + c.total + ' kroků hotovo</div>' +
        '</div>' +
      '</div>' +
      '<div class="detail-grid">' +
        '<div class="info-box">' +
          '<span class="box-title">Kontaktní údaje</span>' +
          '<div class="info-row"><span>ID hráče</span><span>' + (esc(p.id) || '—') + '</span></div>' +
          '<div class="info-row"><span>Telefon hráče</span>' + (p.telefonHrac ? '<a href="tel:' + esc(p.telefonHrac) + '">' + esc(p.telefonHrac) + '</a>' : '<span>—</span>') + '</div>' +
          '<div class="info-row"><span>E-mail hráče</span>' + (p.emailHrac ? '<a href="mailto:' + esc(p.emailHrac) + '">' + esc(p.emailHrac) + '</a>' : '<span>—</span>') + '</div>' +
          '<div class="info-row"><span>Zákonný zástupce</span><span>' + (esc(p.zastupceJmeno) || '—') + '</span></div>' +
          '<div class="info-row"><span>Telefon zástupce</span>' + (p.zastupceTelefon ? '<a href="tel:' + esc(p.zastupceTelefon) + '">' + esc(p.zastupceTelefon) + '</a>' : '<span>—</span>') + '</div>' +
          '<div class="info-row"><span>E-mail zástupce</span>' + (p.zastupceEmail ? '<a href="mailto:' + esc(p.zastupceEmail) + '">' + esc(p.zastupceEmail) + '</a>' : '<span>—</span>') + '</div>' +
        '</div>' +
        '<div class="info-box">' +
          '<span class="box-title">Adresa</span>' +
          '<span style="font-size:13px;">' + (esc(addressLine) || '—') + '</span>' +
          '<span style="font-size:11px;color:#5a6169;">Obec: ' + (esc(p.mesto) || '—') + '</span>' +
        '</div>' +
        '<div class="info-box" style="min-width:100%;">' +
          '<span class="box-title">Registrační checklist</span>' +
          checklistRows +
          '<span class="phase-note">Úpravy checklistu, e-mail, sdílení jako PDF a přesun do vyřazených budou dostupné v další fázi appky.</span>' +
        '</div>' +
      '</div>';
  }

  function render() {
    var main = document.getElementById('main');
    main.innerHTML = state.view === 'detail' ? renderDetailView() : renderListView();

    if (state.view === 'list') {
      var roky = Array.from(new Set(DATA.players.map(function(p){ return String(p.rok); }))).filter(Boolean).sort();
      fillSelect('rokFilter', roky, state.rok);
      fillSelect('cityFilter', DATA.cities, state.city);
      document.getElementById('search').addEventListener('input', function(e) { state.q = e.target.value; render(); });
      document.getElementById('rokFilter').addEventListener('change', function(e) { state.rok = e.target.value; render(); });
      document.getElementById('cityFilter').addEventListener('change', function(e) { state.city = e.target.value; render(); });
    }
  }

  function renderCatList() {
    var html = '<div class="cat-item' + (state.category === 'Vše' ? ' active' : '') + '" data-cat="Vše"><span class="dot" style="background:#5a6169"></span>Vše</div>';
    html += DATA.categoryRules.map(function (r) {
      return '<div class="cat-item' + (state.category === r.label ? ' active' : '') + '" data-cat="' + esc(r.label) + '">' +
        '<span class="dot" style="background:' + esc(r.color) + '"></span>' + esc(r.label) + '</div>';
    }).join('');
    var el = document.getElementById('catList');
    el.innerHTML = html;
    Array.prototype.forEach.call(el.children, function(child) {
      child.addEventListener('click', function() {
        state.category = child.getAttribute('data-cat');
        state.view = 'list';
        renderCatList();
        render();
      });
    });
  }

  function fillSelect(id, values, selected) {
    var el = document.getElementById(id);
    el.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = 'Vše'; allOpt.textContent = (id === 'rokFilter' ? 'Ročník: Vše' : 'Obec: Vše');
    el.appendChild(allOpt);
    values.forEach(function(v) {
      var opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      el.appendChild(opt);
    });
    el.value = selected;
  }
</script>
</body>
</html>
