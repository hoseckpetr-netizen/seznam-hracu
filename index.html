  function confirmAddPlayer(i) {
    var c = importCandidates[i];
    if (!c || !DATA || !DATA.colIndex) return;
    var maxRow = DATA.players.reduce(function(m, p) { return Math.max(m, p.sheetRow); }, DATA.headerRowIdx + 1);
    var targetRow = maxRow + 1;
    var idx = DATA.colIndex;
    var dataArr = [];
    function put(colKey, value) {
      var colIdx = idx[colKey];
      if (colIdx == null || colIdx < 0 || value === '' || value == null) return;
      dataArr.push({ range: 'Seznam!' + colIndexToLetter(colIdx) + targetRow, values: [[value]] });
    }
    put('prijmeni', c.prijmeni);
    put('jmeno', c.jmeno);
    put('datumNarozeni', c.datumNarozeni);
    put('rok', c.rok);
    put('ulice', c.ulice);
    put('cp', c.cp);
    put('mesto', c.mesto);
    put('psc', c.psc);
    put('emailHrac', c.emailHrac);
    put('telefonHrac', c.telefonHrac);
    put('zastupceJmeno', c.zastupceJmeno);
    put('zastupceTelefon', c.zastupceTelefon);
    put('zastupceEmail', c.zastupceEmail);
    put('datumPridani', formatCzechDate(new Date()));
    var regKisCol = idx.checklistCols && idx.checklistCols['REG KIS'];
    if (regKisCol != null && regKisCol >= 0) {
      dataArr.push({ range: 'Seznam!' + colIndexToLetter(regKisCol) + targetRow, values: [[true]] });
    }
    if (!dataArr.length) return;

    fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: dataArr })
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
      return r.json();
    }).then(function() {
      c._added = true;
      pushNotification('Hráč ' + c.jmeno + ' ' + c.prijmeni + ' přidán do tabulky (řádek ' + targetRow + '). Zkontrolujte prosím ID a kategorii přímo v tabulce.', 'info');
      renderImportPreview();
      loadData(); // refresh the roster so the new player appears in the app too
    }).catch(function(err) {
      pushNotification('Přidání hráče ' + c.jmeno + ' ' + c.prijmeni + ' selhalo: ' + err.message, 'error');
    });
  }

  function renderListView() {
    var players = filteredPlayers();
    var selCount = Object.keys(state.selected).filter(function(k) { return state.selected[k]; }).length;
    var rows = players.map(function(p) {
      var c = checklistCounts(p);
      var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
      var checkboxHtml = state.selectMode ?
        '<input type="checkbox" class="pc-check" onclick="event.stopPropagation(); toggleSelect(' + p.sheetRow + ')"' + (state.selected[p.sheetRow] ? ' checked' : '') + '>' : '';
      var clickAction = state.selectMode ? 'toggleSelect(' + p.sheetRow + ')' : 'openDetail(' + p.sheetRow + ')';
      return '<div class="player-card" onclick="' + clickAction + '">' +
        checkboxHtml +
        '<div class="ring" style="' + ringStyle(pct) + '"><div class="ring-hole">' + avatarInnerHtml(p, 96) + '</div></div>' +
        '<span class="pc-name">' + esc(p.jmenoCele) + '</span>' +
        '<span class="pc-birth">' + esc(p.datumNarozeni) + (p.vek ? '<br><b>' + esc(p.vek) + ' let</b>' : '') + '</span>' +
        '<span class="chip"><span class="dot" style="background:' + esc(p.categoryColor) + '"></span>' + esc(displayCategoryLabel(p.categoryGroup)) + '</span>' +
      '</div>';
    }).join('');

    var toolbar = state.selectMode ?
      ('<div class="filters" style="align-items:center;">' +
        '<button class="icon-btn toolbar-btn" onclick="selectAllFiltered()">Vybrat vše (' + players.length + ')</button>' +
        '<button class="icon-btn toolbar-btn" onclick="clearSelection()">Zrušit výběr</button>' +
        '<button class="icon-btn toolbar-btn" onclick="sharePlayersPDF()"' + (selCount ? '' : ' disabled') + '>Sdílet jako PDF</button>' +
        '<span class="sel-count">Vybráno: ' + selCount + '</span>' +
        '<button class="icon-btn toolbar-btn" onclick="toggleSelectMode()" style="margin-left:auto;">Hotovo</button>' +
      '</div>') : '';

    return '<div class="header"><h1>Aktivní hráči</h1><div class="count">' + players.length + ' z ' + DATA.players.length + ' hráčů</div></div>' +
      toolbar +
      '<div class="player-list">' + (rows || '<div class="loading">Žádní hráči neodpovídají filtru.</div>') + '</div>';
  }

  function renderDetailView() {
    var p = DATA.players.find(function(x){ return x.sheetRow === state.selectedRow; });
    if (!p) { state.view = 'list'; return renderListView(); }
    var c = checklistCounts(p);
    var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
    var progressLabel = (c.total > 0 && c.done === c.total) ? 'Vše hotovo' : (c.done + '/' + c.total + ' kroků hotovo');

    var isAdmin = DATA.role === 'admin';
    var checklistRows = activeChecklistKeys(p).map(function(key) {
      var on = p.checklist[key];
      var label = CHECKLIST_LABELS[key] || key;
      var attrs = isAdmin ? ' style="cursor:pointer;" onclick="toggleChecklistItem(' + p.sheetRow + ', \'' + jsStr(key) + '\')" title="Klikněte pro změnu"' : '';
      var dateStr = (CHECKLIST_DATE_KEYS.indexOf(key) !== -1 && p.checklistDates && p.checklistDates[key]) ? '<span class="cl-date">' + esc(p.checklistDates[key]) + '</span>' : '';
      return '<div class="checklist-row"' + attrs + '>' +
        '<span class="cl-label">' + esc(label) + '</span>' +
        dateStr +
        '<span class="cl-icon ' + (on ? 'on' : 'off') + '">' + (on ? '&#10003;' : '&#10005;') + '</span>' +
      '</div>';
    }).join('');

    var addressLine = [p.ulice, p.cp].filter(Boolean).join(' ') + (p.mesto ? (p.ulice || p.cp ? ', ' : '') + p.mesto : '') + (p.psc ? ' ' + p.psc : '');
    var mapsHref = addressLine ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addressLine + ', Česká republika') : null;
    var hasZastupce2 = !!(p.zastupce2Jmeno || p.zastupce2Telefon || p.zastupce2Email);

    function contactRow(label, value, isPhone) {
      var link = value ? ('<a href="' + (isPhone ? 'tel:' : 'mailto:') + esc(value) + '">' + esc(value) + '</a>') : '—';
      return '<div class="info-row"><span>' + esc(label) + '</span><span class="info-value">' + link + (value ? copyBtnHtml(value) : '') + '</span></div>';
    }

    return '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;">' +
        '<button class="detail-back" onclick="backToList()" style="margin-bottom:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Zpět na seznam</button>' +
        '<div style="display:flex;gap:8px;">' +
          (isAdmin ? '<button class="icon-btn toolbar-btn" onclick="openEditModal(' + p.sheetRow + ')">Editovat</button>' : '') +
          '<button class="icon-btn toolbar-btn" onclick="sharePlayerCardPDF()">Sdílet kartu (PDF)</button>' +
        '</div>' +
      '</div>' +
      '<div class="detail-head">' +
        '<div class="detail-photo">' + avatarInnerHtml(p) + '</div>' +
        '<div class="detail-info">' +
          '<div class="detail-name-row">' +
            '<div class="detail-name">' + esc(p.jmenoCele) + '</div>' +
            (p.id ? '<span class="detail-id">FAČR ID ' + esc(p.id) + '</span>' + copyBtnHtml(p.id) : '') +
          '</div>' +
          '<div class="detail-meta">' +
            '<span class="cat-pill" style="background:' + esc(p.categoryColor) + ';color:' + esc(contrastTextColor_(p.categoryColor)) + '">' + esc(displayCategoryLabel(p.categoryGroup)) + '</span>' +
            (p.kategorie ? '<span>' + esc(p.kategorie) + '</span>' : '') +
            '<span class="meta-sep">·</span><span>narozen ' + esc(p.datumNarozeni) + '</span>' +
            (p.vek ? '<span class="meta-sep">·</span><span>' + esc(p.vek) + ' let</span>' : '') +
          '</div>' +
          '<div class="detail-progress-wrap">' +
            '<div class="detail-progress-bar"><div class="detail-progress-fill" id="detailProgressFill" data-pct="' + pct + '" style="width:0%;background:' + esc(p.categoryColor) + '"></div></div>' +
            '<span class="detail-progress-label" style="color:' + esc(p.categoryColor) + '">' + progressLabel + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="detail-grid">' +
        '<div class="info-box">' +
          '<span class="box-title">Kontaktní údaje hráče</span>' +
          contactRow('Telefon hráče', p.telefonHrac, true) +
          contactRow('E-mail hráče', p.emailHrac, false) +
        '</div>' +
        '<div class="info-box">' +
          '<span class="box-title">Zákonný zástupce</span>' +
          '<div class="info-row"><span>Jméno</span><span class="info-value">' + (esc(p.zastupceJmeno) || '—') + (p.zastupceJmeno ? copyBtnHtml(p.zastupceJmeno) : '') + '</span></div>' +
          contactRow('Telefon', p.zastupceTelefon, true) +
          contactRow('E-mail', p.zastupceEmail, false) +
        '</div>' +
        (hasZastupce2 ? (
        '<div class="info-box">' +
          '<span class="box-title">2. zákonný zástupce</span>' +
          '<div class="info-row"><span>Jméno</span><span class="info-value">' + (esc(p.zastupce2Jmeno) || '—') + (p.zastupce2Jmeno ? copyBtnHtml(p.zastupce2Jmeno) : '') + '</span></div>' +
          contactRow('Telefon', p.zastupce2Telefon, true) +
          contactRow('E-mail', p.zastupce2Email, false) +
        '</div>') : '') +
        '<div class="info-box">' +
          '<span class="box-title">Adresa</span>' +
          (mapsHref ? '<a href="' + esc(mapsHref) + '" target="_blank" rel="noopener" style="font-size:13px;color:var(--text);text-decoration:none;">' + esc(addressLine) + '</a>' : '<span style="font-size:13px;">—</span>') +
          '<span style="font-size:11px;color:#5a6169;">Obec: ' + (esc(p.mesto) || '—') + '</span>' +
        '</div>' +
        '<div class="info-box" style="min-width:100%;">' +
          '<span class="box-title">Registrační checklist (' + c.done + '/' + c.total + ')</span>' +
          '<div class="checklist-wrap">' + checklistRows + '</div>' +
        '</div>' +
      '</div>';
  }

  function render() {
    var main = document.getElementById('main');
    if (state.view === 'detail') {
      main.innerHTML = renderDetailView();
      // The fill is rendered at width:0 on purpose — flipping it to its real value one frame
      // later (after the browser has painted the 0% state) is what makes the CSS transition on
      // .detail-progress-fill actually animate, instead of just appearing already full.
      var fillEl = document.getElementById('detailProgressFill');
      if (fillEl) {
        var targetPct = fillEl.getAttribute('data-pct');
        requestAnimationFrame(function() { requestAnimationFrame(function() { fillEl.style.width = targetPct + '%'; }); });
      }
    }
    else if (state.view === 'map') { main.innerHTML = renderMapView(); }
    else if (state.view === 'settings') { main.innerHTML = renderSettingsView(); wireSettingsView(); }
    else if (state.view === 'vyrazeni') { main.innerHTML = renderVyrazeniView(); }
    else { main.innerHTML = renderListView(); }

    // Sdílet/Filtr/Zrušit filtr/Aktualizovat only make sense against the player list — hide
    // them on the player detail card (and close any panel left open from the list view).
    var sidebarToolsEl = document.querySelector('.sidebar-tools');
    if (sidebarToolsEl) {
      sidebarToolsEl.style.display = (state.view === 'detail') ? 'none' : 'grid';
      if (state.view === 'detail') {
        ['sharePanel', 'filterPanel'].forEach(function(id) {
          var p = document.getElementById(id);
          if (p) p.style.display = 'none';
        });
      }
    }

    // Note: the Filtr/Sdílet dropdown panels are deliberately NOT re-rendered here on every
    // render() call — rebuilding the search <input> on each keystroke would reset its cursor
    // position/focus. They're (re)built once when opened (toggleSidebarPanel) and refreshed
    // only when their own controls change.
    if (document.getElementById('sharePanel') && document.getElementById('sharePanel').style.display === 'block') renderSharePanel();
    if (state.view === 'map') {
      var myRenderToken = ++mapLoadToken;
      initMapIfNeeded().then(function() {
        if (myRenderToken !== mapLoadToken) return; // a newer render superseded this one
        plotPlayersOnMap(filteredPlayers());
      }).catch(function() {
        var statusEl = document.getElementById('mapStatus');
        if (statusEl) statusEl.textContent = 'Mapu se nepodařilo načíst. Zkuste to prosím znovu.';
      });
    }
  }

  function renderCatList() {
    // "Vše" is active exactly when nothing else is selected; every other chip can be
    // toggled on/off independently, so several categories (e.g. U11 + U12) can show at once.
    var html = '<div class="cat-item' + (state.categories.length === 0 ? ' active' : '') + '" data-cat="Vše"><span class="dot" style="background:#5a6169"></span>Vše</div>';
    html += DATA.categoryRules.filter(function (r) { return !r.hideFilter; }).map(function (r) {
      return '<div class="cat-item' + (state.categories.indexOf(r.label) !== -1 ? ' active' : '') + '" data-cat="' + esc(r.label) + '">' +
        '<span class="dot" style="background:' + esc(r.color) + '"></span>' + esc(displayCategoryLabel(r.label)) + '</div>';
    }).join('');
    html += '<div class="cat-item" data-cat="__vyrazeni__"><span class="dot" style="background:#5a6169"></span>Vyřazení hráči</div>';
    var el = document.getElementById('catList');
    el.innerHTML = html;
    Array.prototype.forEach.call(el.children, function(child) {
      child.addEventListener('click', function() {
        var cat = child.getAttribute('data-cat');
        if (cat === '__vyrazeni__') { openVyrazeni(); return; }
        if (cat === 'Vše') {
          state.categories = [];
        } else {
          var i = state.categories.indexOf(cat);
          if (i === -1) state.categories.push(cat); else state.categories.splice(i, 1);
        }
        // Stay on the map if the map is already open (so picking a category re-filters
        // the markers in place); only detail view kicks back to the list.
        if (state.view === 'detail') state.view = 'list';
        renderCatList();
        render();
      });
    });
  }

  var modalOverlayEl = document.getElementById('modalOverlay');
  if (modalOverlayEl) {
    modalOverlayEl.addEventListener('click', function(e) { if (e.target === modalOverlayEl) closeModal(); });
  }
  document.addEventListener('click', function(e) {
    if (notifPanelOpen) {
      var panel = document.getElementById('notifPanel');
      var btn = e.target.closest ? e.target.closest('[onclick="toggleNotifications()"]') : null;
      if (panel && !panel.contains(e.target) && !btn) { notifPanelOpen = false; panel.style.display = 'none'; }
    }
    ['sharePanel', 'filterPanel'].forEach(function(id) {
      var panel = document.getElementById(id);
      if (!panel || panel.style.display !== 'block') return;
      // focusSearch() (the magnifying-glass icon) also opens the Filtr panel, on the same
      // click — without recognizing it here too, this handler saw that click as "outside"
      // the panel and closed it again immediately, undoing the open on the very same click.
      var isTriggerBtn = e.target.closest && e.target.closest('[onclick*="toggleSidebarPanel"], [onclick="focusSearch()"]');
      if (!panel.contains(e.target) && !isTriggerBtn) panel.style.display = 'none';
    });
  });

  function fillSelect(id, values, selected) {
    var el = document.getElementById(id);
    el.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = 'Vše'; allOpt.textContent = (id.toLowerCase().indexOf('rok') !== -1 ? 'Ročník: Vše' : 'Obec: Vše');
    el.appendChild(allOpt);
    values.forEach(function(v) {
      var opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      el.appendChild(opt);
    });
    el.value = selected;
  }
</script>
</body>
</html>
