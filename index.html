<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seznam hráčů – FK Slovany Pardubice</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root { --accent: #00FFFF; --bg: #0b0d10; --card: #1a1e23; --border: #262b31; --text: #eef1f3; --muted: #9aa2ab; --green: #34D399; --red: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; flex-shrink: 0; background: #0e1114; border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .logo { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .brand .logo img { width: 100%; height: 100%; object-fit: contain; }
    .brand .name { font-weight: 600; font-size: 14px; }
    .brand .icons { display: flex; gap: 8px; margin-left: auto; }
    .icon-btn { width: 36px; height: 36px; border-radius: 9px; background: var(--card); border: 1px solid var(--border); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; }
    .icon-btn:disabled { opacity: .45; cursor: default; }
    .season { font-size: 11px; color: var(--muted); }
    .cat-list { display: flex; flex-direction: column; gap: 2px; }
    .sidebar-tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .sidebar-tools .toolbar-btn { width: 100%; height: 30px; min-height: 0; min-width: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 3px; padding: 2px; font-size: 9px; white-space: normal; text-align: center; line-height: 1.05; overflow: hidden; }
    .sidebar-tools .toolbar-btn svg { width: 12px; height: 12px; }
    .sidebar-tools .toolbar-btn svg { flex-shrink: 0; }
    .notif-panel .notif-row.clickable { cursor: pointer; }
    .notif-panel .notif-row.clickable:hover { background: rgba(0,255,255,0.08); }
    .filter-panel-inner { padding: 10px; display: flex; flex-direction: column; gap: 7px; }
    .filter-panel-inner input, .filter-panel-inner select { width: 100%; box-sizing: border-box; font-size: 12px; padding: 6px 8px; background: #1a1e23; border: 1px solid var(--border); color: var(--text); border-radius: 7px; font-family: inherit; }
    .filter-panel-inner .fp-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .filter-panel-inner .fp-divider { height: 1px; background: var(--border); margin: 1px 0; }
    .filter-panel-inner .fp-toggle-btn { background: #1a1e23; border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 7px 8px; font-size: 12px; font-family: inherit; cursor: pointer; transition: background .12s ease, border-color .12s ease, color .12s ease; }
    .filter-panel-inner .fp-toggle-btn:hover { border-color: var(--accent); }
    .filter-panel-inner .fp-toggle-btn.active { background: rgba(0,255,255,0.12); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .filter-panel-inner .fp-reset { font-size: 11px; color: var(--muted); text-decoration: none; text-align: center; margin-top: 2px; }
    .filter-panel-inner .fp-reset:hover { color: var(--accent); }
    .cat-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); border: 1px solid transparent; }
    .cat-item.active { background: rgba(0,255,255,0.1); border-color: var(--accent); color: var(--text); }
    .cat-item[data-cat="__vyrazeni__"] { margin-top: 8px; padding-top: 11px; border-top: 1px solid var(--border); border-radius: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .role-badge { margin-top: auto; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .role-badge button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-family: inherit; font-size: 11px; padding: 0; }
    .main { flex: 1; padding: 24px 28px; overflow-y: auto; min-width: 0; }
    .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .header h1 { font-size: 20px; margin: 0; }
    .header .count { font-size: 13px; color: var(--muted); }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    select, input[type=search] { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 12px; }
    .loading { padding: 60px; text-align: center; color: var(--muted); }

    /* Player list (card rows) */
    .player-list { display: flex; flex-direction: column; gap: 8px; }
    .player-card { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px; cursor: pointer; transition: border-color .15s ease; text-decoration: none; color: inherit; }
    .player-card:hover { border-color: var(--accent); }
    .ring { position: relative; width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; }
    .ring .ring-hole { position: absolute; inset: 2px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; overflow: hidden; }
    .ring .ring-hole img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pc-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pc-birth { width: 100px; flex-shrink: 0; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .pc-birth b { font-weight: 700; color: var(--text); }
    .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }

    /* Detail view */
    .detail-back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500; cursor: pointer; background: none; border: none; padding: 0; margin-bottom: 18px; font-family: inherit; }
    .detail-back:hover { color: var(--accent); }
    .detail-head { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin-bottom: 22px; padding: 20px 22px; border-radius: 16px; background: linear-gradient(160deg, var(--card), rgba(0,255,255,0.03)); border: 1px solid var(--border); }
    .detail-head .ring { width: 60px; height: 60px; }
    .detail-head .ring .ring-hole { font-size: 15px; }
    .detail-photo { position: relative; width: 120px; height: 152px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 24px; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
    .detail-info { min-width: 0; flex: 1; }
    .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
    .detail-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .detail-name { font-size: 22px; font-weight: 700; letter-spacing: -0.2px; }
    .detail-meta { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
    .detail-meta .meta-sep { color: var(--border); }
    .cat-pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.2px; white-space: nowrap; }
    .detail-progress-wrap { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .detail-progress-bar { width: 160px; max-width: 40vw; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; flex-shrink: 0; }
    .detail-progress-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .7s cubic-bezier(.22,.9,.34,1); }
    .detail-progress-label { font-size: 12px; font-weight: 600; color: var(--accent); white-space: nowrap; }
    @keyframes detailFadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes detailPhotoPop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .detail-head { animation: detailFadeInUp .4s ease; }
    .detail-head .detail-photo { animation: detailPhotoPop .4s ease; }
    .detail-grid { animation: detailFadeInUp .45s ease .06s backwards; }
    .detail-name-row .detail-id { margin-left: 0; }
    .detail-grid { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .settings-sub { font-size: 13px; color: var(--muted); margin: -10px 0 18px; }
    .info-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 280px; }
    .info-box .box-title { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
    .box-title.box-head { display: flex; align-items: center; gap: 7px; }
    .box-title.box-head svg { color: var(--accent); flex-shrink: 0; }
    .info-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
    .info-row span:first-child { color: var(--muted); flex-shrink: 0; }
    .info-row a { color: var(--text); text-decoration: none; }
    .info-row a:hover { color: var(--accent); }
    .info-box > a:hover { color: var(--accent) !important; text-decoration: underline !important; }
    .cat-editor-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -20px; padding: 0 20px; }
    .cat-editor { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cat-editor th { text-align: left; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .cat-editor td { padding: 7px 8px; border-bottom: 1px solid #20242a; vertical-align: middle; }
    .cat-editor tbody tr:hover td { background: rgba(255,255,255,0.02); }
    .cat-editor input[type="text"], .cat-editor input[type="number"] { background: #1a1e23; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-family: inherit; font-size: 12px; }
    .cat-editor input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .color-swatch-wrap { display: inline-flex; align-items: center; }
    .color-swatch { width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0; cursor: pointer; box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--border); transition: transform .12s ease, box-shadow .12s ease; flex-shrink: 0; }
    .color-swatch:hover { transform: scale(1.08); box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--accent); }
    .color-swatch:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--accent); }
    .color-popover { position: fixed; z-index: 200; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); width: 208px; }
    .color-popover-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 10px; }
    .color-popover-grid button { width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0; cursor: pointer; transition: transform .1s ease; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
    .color-popover-grid button:hover { transform: scale(1.14); }
    .color-popover-grid button.active { box-shadow: 0 0 0 2px var(--card), 0 0 0 2px var(--text), inset 0 0 0 1px rgba(255,255,255,0.12); }
    .color-popover-hex { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
    .color-popover-hex .color-swatch-preview { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
    .color-popover-hex input { flex: 1; min-width: 0; background: #1a1e23; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 7px; font-family: inherit; font-size: 12px; }
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; vertical-align: middle; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch-slider { position: absolute; inset: 0; background: var(--border); border-radius: 999px; cursor: pointer; transition: background .15s ease; }
    .switch-slider::before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px; background: #1a1a1a; border-radius: 50%; transition: transform .15s ease; }
    .switch input:checked + .switch-slider { background: var(--accent); }
    .switch input:checked + .switch-slider::before { transform: translateX(14px); }
    .switch input:focus-visible + .switch-slider { outline: 2px solid var(--accent); outline-offset: 2px; }
    .cat-editor a { color: var(--accent); text-decoration: none; }
    .cat-player-list { margin-top: 6px; font-size: 12px; color: var(--muted); max-height: 160px; overflow-y: auto; }
    .add-cat-card { margin-top: 12px; padding: 14px; border: 1px dashed var(--border); border-radius: 12px; background: rgba(255,255,255,0.015); }
    .add-cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .add-cat-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
    .add-cat-grid input { width: 100%; box-sizing: border-box; background: #1a1e23; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-family: inherit; font-size: 13px; }
    .add-cat-grid label .color-swatch-wrap { margin-top: 2px; }
    .checklist-wrap { display: flex; flex-direction: column; }
    .checklist-row { display: flex; align-items: center; gap: 10px; padding: 3px 2px; border-bottom: 1px solid #20242a; }
    .checklist-row:last-child { border-bottom: none; }
    .checklist-row .cl-label { flex: 1; font-size: 12px; }
    .cl-date { font-size: 10px; color: var(--muted); flex-shrink: 0; white-space: nowrap; margin-right: 4px; }
    .cl-icon { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .cl-icon.on { background: rgba(52,211,153,0.15); color: var(--green); }
    .cl-icon.off { background: rgba(248,113,113,0.15); color: var(--red); }
    .phase-note { font-size: 11px; color: #5a6169; padding-top: 4px; }

    /* Copy-to-clipboard icons */
    .copy-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .copy-btn:hover { color: var(--accent); }
    .copy-btn.copied { color: var(--green); }
    .info-value { display: inline-flex; align-items: center; gap: 6px; }
    .detail-id { font-size: 11px; font-weight: 500; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; margin-left: 8px; vertical-align: middle; }

    /* Notification bell */
    .notif-panel { display: none; position: absolute; top: 44px; right: 0; width: 300px; max-height: 360px; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .notif-row { display: flex; gap: 8px; padding: 8px 6px; border-bottom: 1px solid #20242a; font-size: 12px; }
    .notif-row:last-child { border-bottom: none; }
    .notif-row.unread { background: rgba(0,255,255,0.05); border-radius: 8px; }
    .notif-icon { flex-shrink: 0; }
    .notif-time { font-size: 10px; color: var(--muted); }
    .notif-empty { padding: 16px; text-align: center; color: var(--muted); font-size: 12px; }

    /* Modal (edit form, import preview) */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
    .modal-box h2 { font-size: 16px; margin: 0 0 14px; }
    .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .form-row label { font-size: 11px; color: var(--muted); }
    .form-row input, .form-row select { background: #12151a; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 13px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .modal-actions button { width: auto; padding: 9px 16px; font-size: 13px; font-family: inherit; }
    .diff-summary { font-size: 12px; background: #12151a; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .diff-summary div { padding: 2px 0; }
    .diff-summary b { color: var(--accent); }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Selection / sharing toolbar */
    .toolbar-btn { width: auto; padding: 8px 14px; font-size: 12px; white-space: nowrap; font-family: inherit; }
    .toolbar-btn:disabled { opacity: .4; cursor: default; }
    .pc-check { width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
    .sel-count { font-size: 12px; color: var(--accent); font-weight: 600; align-self: center; }

    /* Map view */
    #mapContainer { background: var(--card); }

    /* Print-only share view (player card / roster list as PDF via browser print) */
    #printArea { display: none; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 16px; color: #000; background: #fff; font-family: Arial, Helvetica, sans-serif; }
      #printArea h1 { font-size: 18px; margin: 0 0 4px; }
      #printArea h2 { font-size: 14px; margin: 18px 0 6px; }
      #printArea .meta { font-size: 11px; color: #444; margin-bottom: 14px; }
      #printArea table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 4px; }
      #printArea th, #printArea td { border: 1px solid #999; padding: 5px 8px; text-align: left; }
      #printArea th { background: #eee; }
    }

    /* Sign-in screen */
    .signin-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; text-align: center; padding: 20px; }
    .signin-screen .logo { width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
    .signin-screen .logo img { width: 100%; height: 100%; object-fit: contain; }
    .signin-screen h1 { font-size: 18px; margin: 0; }
    .signin-screen p { color: var(--muted); font-size: 13px; max-width: 360px; margin: 0; }
    .gsi-btn-wrap { margin-top: 6px; }
    .signin-error { color: var(--red); font-size: 13px; max-width: 360px; }

    @media (max-width: 760px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: column; align-items: stretch; padding: 12px 14px 10px; gap: 10px; }
      .brand { width: 100%; }
      .brand .icons { display: flex; gap: 8px; margin-left: auto; }
      .sidebar .season { display: none; }
      .cat-list { flex-direction: row; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
      .cat-item { white-space: nowrap; flex-shrink: 0; border-radius: 999px; padding: 8px 14px; border: 1px solid var(--border); background: var(--card); }
      .cat-item.active { background: rgba(0,255,255,0.13); border-color: var(--accent); }
      .cat-item[data-cat="__vyrazeni__"] { margin-top: 0; padding-top: 8px; border-top: 1px solid var(--border); border-radius: 999px; margin-left: 6px; }
      .role-badge { display: none; }
      .main { padding: 14px 12px; }
      .header h1 { font-size: 17px; }
      .filters { flex-direction: column; }
      .filters input, .filters select { width: 100%; }
      .pc-birth { width: 62px; font-size: 10px; }
      .detail-grid { flex-direction: column; }
      .info-box { min-width: 0; width: 100%; }
      .detail-head { flex-wrap: nowrap; align-items: flex-start; gap: 12px; padding: 14px 14px; }
      .detail-photo { width: 84px; height: 108px; font-size: 18px; }
      .detail-name { font-size: 16px; }
      .detail-progress-bar { width: 110px; }
      .settings-sub { margin: -6px 0 14px; font-size: 12px; }
      .info-box { padding: 14px 14px; gap: 10px; }
      .cat-editor-wrap { margin: 0 -14px; padding: 0 14px; }
      .cat-editor { font-size: 11px; }
      .cat-editor th, .cat-editor td { padding: 5px 5px; }
      .cat-editor input[type="text"], .cat-editor input[type="number"] { font-size: 11px; }
      .add-cat-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div id="signinScreen" class="signin-screen">
    <div class="logo"><img src="logo.png" alt="FK Slovany Pardubice"></div>
    <h1>Seznam hráčů – FK Slovany Pardubice</h1>
    <p>Pro přístup se přihlaste svým Google účtem, který má sdílený přístup k tabulce Seznam hráčů.</p>
    <div class="gsi-btn-wrap" id="gsiBtnWrap">
      <button class="icon-btn" style="width:auto;padding:10px 20px;font-size:13px;" id="manualSigninBtn" type="button" onclick="signIn()">Přihlásit se přes Google</button>
    </div>
    <div class="signin-error" id="signinError"></div>
  </div>

  <div class="app" id="appRoot" style="display:none;">
    <div class="sidebar">
      <div class="brand">

    if (cache[key]) { p.photoDataUrl = cache[key]; if (!skipRender) render(); return Promise.resolve(true); }
    return ensurePhotoIndex().then(function(idx) {
      // Most photos are named "Příjmení Jméno", but a few get added as "Jméno Příjmení"
      // (natural reading order) instead — try both before giving up, so a photo doesn't
      // silently fail to match just because of word order.
      var f = idx[key] || idx[normalizePhotoKey(p.jmeno + ' ' + p.prijmeni)];
      if (!f) {
        if (!silent) pushNotification('Fotka pro ' + p.jmenoCele + ' nenalezena ve složce "Fotky hráčů" (hledáno jako "' + p.prijmeni + ' ' + p.jmeno + '").', 'warn');
        return false;
      }
      return fetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media', { headers: { 'Authorization': 'Bearer ' + accessToken } })
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
        .then(function(blob) { return blobToResizedDataUrl(blob, 300, 0.75); })
        .then(function(dataUrl) {
          cache[key] = dataUrl;
          savePhotoCache(cache);
          p.photoDataUrl = dataUrl;
          if (!silent) pushNotification('Fotka hráče ' + p.jmenoCele + ' byla naimportována.', 'info');
          if (!skipRender) render();
          return true;
        });
    }).catch(function(err) {
      if (!silent) pushNotification('Import fotky hráče ' + p.jmenoCele + ' selhal: ' + err.message, 'error');
      return false;
    });
  }
  // Runs right after every load (any signed-in account, not just admin — it only ever reads
  // from Drive into this browser's own cache, never writes anything back to the sheet) so
  // photos just show up in the list, instead of only appearing one by one as each player's
  // card gets opened.
  function autoImportMissingPhotos() {
    if (!DATA || !DATA.players) return;
    var candidates = DATA.players.filter(function(p) { return p.checklist['FOTO PC'] && !p.photoDataUrl; });
    if (!candidates.length) return;
    var CONCURRENCY = 5;
    var nextIndex = 0;
    function worker() {
      var i = nextIndex++;
      if (i >= candidates.length) return;
      importPlayerPhoto(candidates[i], true, false).then(worker);
    }
    for (var w = 0; w < Math.min(CONCURRENCY, candidates.length); w++) worker();
  }
  function avatarInnerHtml(p, size) {
    if (p.photoDataUrl) {
      return '<img src="' + p.photoDataUrl + '" alt="" onerror="this.outerHTML=\'' + jsStr(esc(initials(p.jmenoCele))) + '\';">';

  }

  // ---------- Notification center (bell icon) ----------
  var notifications = [];
  var notifPanelOpen = false;
  function loadNotifications() {
    try { notifications = JSON.parse(localStorage.getItem('fks_notifications') || '[]'); } catch (e) { notifications = []; }
  }
  function saveNotifications() {
    try { localStorage.setItem('fks_notifications', JSON.stringify(notifications.slice(0, 40))); } catch (e) {}
  }
  function pushNotification(text, type) {
    notifications.unshift({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 7), text: text, type: type || 'info', ts: new Date().toISOString(), read: false });
    saveNotifications();
    renderBell();
  }
  function unreadNotifCount() {
    return notifications.filter(function(n) { return !n.read; }).length;
  }
  function formatNotifTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('cs-CZ') + ' ' + d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
  }
  function notifIconFor(type) {
    if (type === 'error') return '<span style="color:var(--red);">&#9888;</span>';
    if (type === 'warn') return '<span style="color:#FBBF24;">&#9888;</span>';
    return '<span style="color:var(--green);">&#10003;</span>';
  }

    var badge = document.getElementById('notifBadge');

  function notifPanelHtml() {
    if (!notifications.length) return '<div class="notif-empty">Zatím žádné notifikace.</div>';
    return notifications.slice(0, 20).map(function(n) {
      return '<div class="notif-row' + (n.read ? '' : ' unread') + '">' +
        '<span class="notif-icon">' + notifIconFor(n.type) + '</span>' +
        '<span class="notif-text">' + esc(n.text) + '<br><span class="notif-time">' + formatNotifTime(n.ts) + '</span></span>' +
      '</div>';
    }).join('');
  }
  // ---------- Sidebar Sdílet / Filtr dropdown panels ----------
  function toggleSidebarPanel(which, btn) {
    var ids = { share: 'sharePanel', filter: 'filterPanel' };
    Object.keys(ids).forEach(function(key) {
      var el = document.getElementById(ids[key]);
      if (!el) return;
      if (key === which) {
        var isOpen = el.style.display === 'block';
        if (isOpen) {
          el.style.display = 'none';
        } else {
          el.style.display = 'block';
          if (key === 'filter') renderFilterPanel();
          if (key === 'share') renderSharePanel();
          if (btn) positionDropdownPanel_(el, btn);
        }
      } else {
        el.style.display = 'none';
      }
    });
  }
  // Dropdown panels (Sdílet/Filtr) were positioned with plain CSS `right:0`, relative to a
  // narrow toolbar button — on mobile that pushed a wide panel off the left edge of the
  // screen (clipped, unreadable). Positioning them as `fixed`, computed from the button's own
  // on-screen position and clamped to the viewport, keeps them fully visible regardless of
  // how narrow their container is.
  function positionDropdownPanel_(panelEl, btn) {
    var rect = btn.getBoundingClientRect();
    var width = panelEl.offsetWidth || 230;
    var left = rect.left;
    if (left + width > window.innerWidth - 8) left = window.innerWidth - width - 8;
    if (left < 8) left = 8;
    var top = rect.bottom + 6;
    if (top + panelEl.offsetHeight > window.innerHeight - 8) top = Math.max(8, rect.top - panelEl.offsetHeight - 6);
    panelEl.style.position = 'fixed';
    panelEl.style.left = left + 'px';
    panelEl.style.top = top + 'px';
    panelEl.style.right = 'auto';
  }

  // Finds a header column whose (trimmed) text CONTAINS substr — used for the
  // "Zákonný zástupce" header, which in the real sheet is not an exact match
  // (it's appended to a long note in the same cell), so an exact-key lookup
  // in buildColumnMap_ silently fails and returns -1.
  function findColBySubstring_(headerRow, substr) {
    for (var i = 0; i < headerRow.length; i++) {
      var name = (headerRow[i] || '').toString().trim();
      if (name.indexOf(substr) !== -1) return i;
    }
    return -1;
  }

  function parseRoster_(values, sheetName) {
    var headerRowIdx = findHeaderRowIndex_(values, 'Příjmení');
    var header = values[headerRowIdx];
    var map = buildColumnMap_(header);

    // The "Zákonný zástupce" header cell in the real sheet holds a long note
    // text ending in "...Zákonný zástupce", not an exact "Zákonný zástupce"
    // string, so it must be found by substring — not via buildColumnMap_'s
    // exact-key lookup (col_ with 'Zákonný zástupce' always returned -1).
    // The Telefon/E-mail for the zástupce are the two columns immediately
    // to its right (confirmed against the real header layout).
    var zastupceJmenoIdx = findColBySubstring_(header, 'Zákonný zástupce');

    // Some players also have a SECOND guardian. In the real sheet this block's
    // own header row just says plain "Jméno"/"Telefon"/"E-mail" (no distinguishing
    // text), but two rows above the header row there is a group-title cell reading
    // "2.   Z Á S T U P C E " (letter-spaced, stylized) directly above the "Jméno"
    // column of that block — mirroring how the first guardian's "Zákonný zástupce"
    // block is laid out. Detected by a normalized (whitespace-stripped, uppercased)
    // substring match so the exact spacing/styling doesn't matter.
    var zastupce2Idx = -1;
    if (headerRowIdx >= 2) {
      var groupRow = values[headerRowIdx - 2] || [];
      for (var gi = 0; gi < groupRow.length; gi++) {
        var norm = (groupRow[gi] || '').toString().toUpperCase().replace(/\s+/g, '');
        if (norm.indexOf('ZÁSTUPCE') !== -1 && norm.indexOf('2') !== -1) { zastupce2Idx = gi; break; }
      }
    }

    var idx = {
      prijmeni: col_(map, 'Příjmení'),
      jmeno: col_(map, 'Jméno', 0),
      datumPridani: col_(map, sheetName === 'Vyřazené' ? 'Datum vyřazení' : 'Datum přidání'),
      rok: col_(map, 'Rok'),
      kategorie: col_(map, 'Kategorie'),
      datumNarozeni: col_(map, 'Datum narození (M,D,R)'),
      vek: col_(map, 'Věk'),
      pohlavi: col_(map, 'Pohlaví'),
      ulice: col_(map, 'Ulice'),
      cp: col_(map, 'čp'),
      mesto: col_(map, 'Město'),
      psc: col_(map, 'PSČ'),
      emailHrac: col_(map, 'E-mail', 0),
      telefonHrac: col_(map, 'Telefon', 0),
      id: col_(map, 'ID'),
      zastupceJmeno: zastupceJmenoIdx,
      zastupceTelefon: zastupceJmenoIdx >= 0 ? zastupceJmenoIdx + 1 : -1,
      zastupceEmail: zastupceJmenoIdx >= 0 ? zastupceJmenoIdx + 2 : -1,
      zastupce2Jmeno: zastupce2Idx,
      zastupce2Telefon: zastupce2Idx >= 0 ? zastupce2Idx + 1 : -1,
      zastupce2Email: zastupce2Idx >= 0 ? zastupce2Idx + 2 : -1,
      checklistCols: (function() {
        var m = {};
        CHECKLIST_KEYS.forEach(function(key) { m[key] = col_(map, key); });
        return m;
      })(),
      checklistDateCols: (function() {
        var m = {};
        CHECKLIST_DATE_KEYS.forEach(function(key) { m[key] = col_(map, key + ' DATUM'); });
        return m;
      })()
    };

    var players = [];
    for (var r = headerRowIdx + 1; r < values.length; r++) {
      var row = values[r];
      var prijmeni = val_(row, idx.prijmeni);
      var jmeno = val_(row, idx.jmeno);
      if (!prijmeni && !jmeno) continue;

      var checklist = {};
      CHECKLIST_KEYS.forEach(function (key) {
        var ci = col_(map, key);
        checklist[key] = ci >= 0 ? (row[ci] === true) : false;
      });
      var checklistDates = {};
      CHECKLIST_DATE_KEYS.forEach(function (key) {
        var ci = idx.checklistDateCols[key];
        checklistDates[key] = ci >= 0 ? val_(row, ci) : '';
      });

      players.push({
        sheetRow: r + 1,
        prijmeni: prijmeni,
        jmeno: jmeno,

        rok: val_(row, idx.rok),
        kategorie: val_(row, idx.kategorie),
        datumNarozeni: val_(row, idx.datumNarozeni),
        vek: val_(row, idx.vek),
        pohlavi: val_(row, idx.pohlavi),
        ulice: val_(row, idx.ulice),
        cp: val_(row, idx.cp),
        mesto: val_(row, idx.mesto),
        psc: val_(row, idx.psc),
        emailHrac: val_(row, idx.emailHrac),
        telefonHrac: val_(row, idx.telefonHrac),
        id: val_(row, idx.id),
        zastupceJmeno: val_(row, idx.zastupceJmeno),
        zastupceTelefon: val_(row, idx.zastupceTelefon),
        zastupceEmail: val_(row, idx.zastupceEmail),
        zastupce2Jmeno: val_(row, idx.zastupce2Jmeno),
        zastupce2Telefon: val_(row, idx.zastupce2Telefon),
        zastupce2Email: val_(row, idx.zastupce2Email),
        checklist: checklist,
        checklistDates: checklistDates
      });
    }
    return { players: players, colIndex: idx, headerRowIdx: headerRowIdx };
  }

  // ---------- "Vyřazené" (players who left the club) ----------
  // Structurally different from "Seznam": it's an older layout where the checklist item
  // names live in the row ABOVE the header row (not in the header row itself), and the
  // checklist itself uses its own older set of item names. Read-only in the app — Petr
  // moves a player's row into this sheet by hand in Google Sheets when they leave.
  var VYRAZENE_CHECKLIST_KEYS = ['NSA', 'FAČR', 'PLATBA FAČR', 'ČLEN KLUBU', 'HRÁČ KLUBU', 'PŘIIHLÁŠKA', 'KONTAKT', 'WHATS UP', 'FOTO PC', 'FOTO', 'PLATBA ÚČET', 'PLATBA CASH'];

  function parseVyrazeneRoster_(values) {

    var map = buildColumnMap_(header);
    var groupMap = buildColumnMap_(groupRow);

    var idx = {
      prijmeni: col_(map, 'Příjmení'),

      var checklist = {};
      VYRAZENE_CHECKLIST_KEYS.forEach(function(key) {

      });

      players.push({
        sheetRow: r + 1,

        jmenoCele: (jmeno + ' ' + prijmeni).trim(),
        datumVyrazeni: val_(row, idx.datumVyrazeni),
        rok: val_(row, idx.rok),
        kategorie: val_(row, idx.kategorie),
        datumNarozeni: val_(row, idx.datumNarozeni),
        vek: val_(row, idx.vek),
        pohlavi: val_(row, idx.pohlavi),
        ulice: val_(row, idx.adresa), // "Adresa" column here plays the same role as "Ulice" in Seznam
        cp: val_(row, idx.cp),
        mesto: val_(row, idx.mesto),
        psc: val_(row, idx.psc),
        emailHrac: val_(row, idx.emailHrac),
        telefonHrac: val_(row, idx.telefonHrac),
        id: val_(row, idx.id),
        zastupceJmeno: val_(row, idx.zastupceJmeno),

  // Columns read (all relative to the detected "od" column): od, do, kód (label), and two
  // columns the app itself owns and writes — barva (hex color) and "zobrazit jako" (display
  // override, e.g. so Minipřípravka can show as U7). Older sheets without those last two
  // columns just get computed defaults (colorForLabel_ / CATEGORY_LABEL_DISPLAY) until saved
  // once from the app's Nastavení screen, which then fills them in going forward.
  function parseCategoryRules_(values) {
    if (!values || !values.length) return { rules: [], catCol: -1 };
    // Find the real "od"/"kód" block by its own sub-header row ("...od", "...do", "Kategorie"),
    // not by which "YYYY-YYYY" season header has the highest year. The sheet can (and does)
    // have more than one such season block at once — e.g. a "Nově" planning block added for
    // next season sits further right with a *higher* year but isn't filled in yet — and
    // picking the wrong one used to silently produce zero usable rules (every player then
    // fell back to their own raw, sometimes stale, "Kategorie" cell instead of being matched
    // by birth year, which is how the wrong players ended up in the wrong category).
    var bestCol = -1;
    var subHeaderRow = values[1] || [];
    for (var i = 0; i < subHeaderRow.length; i++) {
      var cell = (subHeaderRow[i] || '').toString().trim().toLowerCase();
      if (cell === 'kategorie' && i >= 2) { bestCol = i - 2; break; }
    }
    // Fallback for an older/differently-labeled sheet: the first "YYYY-YYYY" season header.
    if (bestCol === -1) {
      var headerRow = values[0] || [];
      for (var j = 0; j < headerRow.length; j++) {
        if (/^(\d{4})-(\d{4})$/.test((headerRow[j] || '').toString().trim())) { bestCol = j; break; }
      }
    }
    if (bestCol === -1) return { rules: [], catCol: -1 };

    // Color and "zobrazit jako" overrides are deliberately NOT read from extra columns next
    // to od/do/label: this sheet already uses the columns just past the label for a second,
    // still being filled in, "Nově" (next season) block — writing app-owned columns there
    // would silently overwrite Petr's own in-progress data. Those overrides are kept in this
    // browser's localStorage instead (see loadCategoryColorOverrides_) until there's a
    // reliable free spot (e.g. Petr adds a dedicated column, or the app gets its own tab).
    var rules = [];
    for (var r = 2; r < values.length; r++) {
      var od = values[r][bestCol];
      var doo = values[r][bestCol + 1];
      var label = (values[r][bestCol + 2] || '').toString().trim();
      if (!label) continue;
      rules.push({
        id: 'kat' + r,
        sheetRow: r + 1, // values[] is 0-indexed; sheet rows are 1-indexed
        label: label,
        from: Number(od) || null,
        to: Number(doo) || null
      });
    }
    return { rules: rules, catCol: bestCol };
  }

  // Always returns a #rrggbb hex string (never hsl(...)) so it can be used directly as an
  // <input type="color"> value in the Nastavení category editor.
  function colorForLabel_(label) {
    if (CATEGORY_COLORS[label]) return CATEGORY_COLORS[label];
    var hash = 0;
    for (var i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) % 360;
    return hslToHex_(hash, 65, 60);
  }
  function hslToHex_(h, s, l) {
    s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    var rgb = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return '#' + rgb.map(function(v) { return Math.round((v + m) * 255).toString(16).padStart(2, '0'); }).join('');
  }
  // Picks readable black/white text for a solid-color badge, given its hex background.
  function contrastTextColor_(hex) {
    var h = (hex || '').replace('#', '');
    if (h.length !== 6) return '#0b0d10';
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 150 ? '#0b0d10' : '#ffffff';
  }

  function matchCategoryRule_(rok, rules) {
    var r = Number(rok);
    for (var i = 0; i < rules.length; i++) {
      var rule = rules[i];
      if (rule.from == null && rule.to == null) continue;
      var lo = (rule.from != null) ? rule.from : -Infinity;
      var hi = (rule.to != null) ? rule.to : Infinity;
      if (r >= lo && r <= hi) return rule;
    }
    return null;
  }

  // ---------- Data loading (Sheets API v4, direct from browser) ----------
  // Manual refresh (toolbar button): re-fetches the sheet AND forces the Drive "Fotky hráčů"
  // folder listing to be re-read, instead of reusing whatever was cached in memory from page
  // load. Without the photoIndex reset, a photo added to Drive *after* this tab was opened
  // would never be found until a full page reload — which also throws away the sign-in and
  // makes the person log in again. This does neither: the access token stays valid, so it's
  // just a normal re-fetch.
  function refreshAppData() {
    photoIndex = null;
    photoIndexPromise = null;
    loadData(true);
  }
  function loadData(isManualRefresh) {
    document.getElementById('main').innerHTML = '<div class="loading">Načítám data ze Sheetu…</div>';
    var slowTimer = setTimeout(function() {
      var el = document.getElementById('main');
      if (el && el.querySelector('.loading')) {
        el.innerHTML = '<div class="loading">Stále se načítá…</div>';
      }
    }, 6000);

    fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { 'Authorization': 'Bearer ' + accessToken }
    }).then(function(r) { return r.json(); }).then(function(userinfo) {
      var email = (userinfo.email || '').toLowerCase();
      var role = ADMIN_EMAILS.indexOf(email) !== -1 ? 'admin' : (VIEWER_EMAILS.indexOf(email) !== -1 ? 'viewer' : null);
      if (!role) {
        clearTimeout(slowTimer);
        document.getElementById('main').innerHTML = '<div class="loading">Přístup odepřen.<br>Účet ' + esc(email) + ' nemá k appce přístup. Pokud si myslíte, že jde o omyl, napište Petrovi.<br><br><button id="signoutBtn" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;">Odhlásit a zkusit jiný účet</button></div>';
        var so = document.getElementById('signoutBtn');
        if (so) so.addEventListener('click', signOut);
        return;
      }

      var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID +
        '/values:batchGet?ranges=Seznam&ranges=Kategorie&ranges=' + encodeURIComponent('Vyřazené') + '&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING';

      return fetch(url, { headers: { 'Authorization': 'Bearer ' + accessToken } })
        .then(function(r) {
          if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
          return r.json();
        })
        .then(function(json) {
          clearTimeout(slowTimer);
          var seznamValues = (json.valueRanges[0] && json.valueRanges[0].values) || [];
          var kategorieValues = (json.valueRanges[1] && json.valueRanges[1].values) || [];
          var vyrazeneValues = (json.valueRanges[2] && json.valueRanges[2].values) || [];

          var parsed = parseRoster_(seznamValues, 'Seznam');
          var players = parsed.players;
          var catParsed = parseCategoryRules_(kategorieValues);
          var catOverrides = loadCategoryColorOverrides_();
          var rulesWithColor = catParsed.rules.map(function (r) {
            var ov = catOverrides[r.label];
            return {
              id: r.id, sheetRow: r.sheetRow, label: r.label, from: r.from, to: r.to,
              color: (ov && ov.color) || colorForLabel_(r.label),
              display: (ov && ov.display) || CATEGORY_LABEL_DISPLAY[r.label] || r.label,
              hideFilter: !!(ov && ov.hideFilter),
              sheetBacked: true
            };
          });

          players.forEach(function (p) {
            var rule = matchCategoryRule_(p.rok, rulesWithColor);
            if (!rule) rule = rulesWithColor.find(function(r) { return r.label === (p.kategorie || '').toString().trim(); }) || null;
            p.categoryGroup = rule ? rule.label : (p.kategorie || 'Nezařazeno');
            p.categoryColor = rule ? rule.color : colorForLabel_(p.kategorie || 'Nezařazeno');
          });

          // Auto-discover any category a player actually has (from the sheet's own
          // "Kategorie" column, e.g. "Muži") that isn't a year-range rule above — so it
          // still shows up as a filter chip and in Nastavení, even before it's been given
          // a proper row in the Kategorie sheet tab. Its color can still be customized and
          // saved (see saveCategoryOverrides), just stored per-browser until it gets a row.
          var knownLabels = {};
          rulesWithColor.forEach(function(r) { knownLabels[r.label] = true; });
          var orphanLabels = [];
          players.forEach(function(p) {
            if (!knownLabels[p.categoryGroup] && p.categoryGroup !== 'Nezařazeno' && orphanLabels.indexOf(p.categoryGroup) === -1) {
              orphanLabels.push(p.categoryGroup);
            }
          });
          orphanLabels.forEach(function(label) {
            var ov = catOverrides[label];
            var color = (ov && ov.color) || colorForLabel_(label);
            var display = (ov && ov.display) || CATEGORY_LABEL_DISPLAY[label] || label;
            rulesWithColor.push({ id: 'orphan_' + label, sheetRow: null, label: label, from: null, to: null, color: color, display: display, hideFilter: !!(ov && ov.hideFilter), sheetBacked: false });
          });
          // Re-apply colors now that orphan rules (and their possible per-browser color
          // overrides) exist, so a player in an orphan group gets the customized color too.
          players.forEach(function(p) {
            var match = rulesWithColor.find(function(r){ return r.label === p.categoryGroup; });
            if (match) p.categoryColor = match.color;
          });

          var cities = {};
          players.forEach(function (p) { if (p.mesto) cities[p.mesto] = true; });

          var vyrazeni = [];
          try {
            var parsedV = parseVyrazeneRoster_(vyrazeneValues);
            vyrazeni = parsedV.players;
            vyrazeni.forEach(function(p) {
              p.categoryGroup = p.kategorie || 'Nezařazeno';
              p.categoryColor = colorForLabel_(p.categoryGroup);
            });
          } catch (e) {
            // Missing/renamed "Vyřazené" sheet shouldn't break the main roster view.
          }

          DATA = {
            players: players,
            vyrazeni: vyrazeni,
            categoryRules: rulesWithColor,
            categoryCol: catParsed.catCol,
            cities: Object.keys(cities).sort(),
            season: 'Seznam hráčů 26/27',
            role: role,
            colIndex: parsed.colIndex,
            headerRowIdx: parsed.headerRowIdx
          };

          document.getElementById('season').textContent = DATA.season;
          document.getElementById('roleBadge').innerHTML = '<span>' + (role === 'admin' ? 'Přihlášen jako správce' : 'Přihlášen jako náhled') + '</span><button onclick="signOut()">Odhlásit</button>';
          applyCachedPhotosToRoster();
          renderCatList();
          render();
          autoImportMissingPhotos();
          if (isManualRefresh) pushNotification('Data i fotky byly aktualizovány.', 'info');
        });
    }).catch(function(err) {
      clearTimeout(slowTimer);
      document.getElementById('main').innerHTML = '<div class="loading">Chyba: ' + esc(err.message) + '<br><br><button id="retryBtn" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;">Zkusit znovu</button></div>';
      var btn = document.getElementById('retryBtn');
      if (btn) { btn.addEventListener('click', function() { loadData(); }); }
    });
  }

  // The search box lives inside the Filtr dropdown panel (built by renderFilterPanel), not as

  // sure the list view + Filtr panel are open first, then focuses the box inside it.
  function focusSearch() {
    if (state.view !== 'list') { state.view = 'list'; render(); }
    var filterBtn = document.querySelector('.sidebar-tools [onclick*="toggleSidebarPanel(\'filter\'"]');
    var panel = document.getElementById('filterPanel');
    if (panel && panel.style.display !== 'block' && filterBtn) toggleSidebarPanel('filter', filterBtn);
    var el = document.getElementById('sidebarSearch');
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.focus(); }
  }

  function checklistCounts(p) {
    var keys = activeChecklistKeys(p);
    var done = keys.filter(function(k){ return p.checklist[k]; }).length;
    return { done: done, total: keys.length };
  }

  function ringStyle(pct, color) {
    return 'background:conic-gradient(' + (color || 'var(--accent)') + ' ' + pct + '%, var(--border) ' + pct + '% 100%);';
  }

  function filteredPlayers() {
    return DATA.players.filter(function(p) {
      if (state.categories.length && state.categories.indexOf(p.categoryGroup) === -1) return false;
      if (state.rok !== 'Vše' && String(p.rok) !== state.rok) return false;
      if (state.city !== 'Vše' && p.mesto !== state.city) return false;
      if (state.q && p.jmenoCele.toLowerCase().indexOf(state.q.toLowerCase()) === -1) return false;
      if (state.missingAnyStep && activeChecklistKeys(p).every(function(k) { return p.checklist[k]; })) return false;
      if (state.noPhoto && p.photoDataUrl) return false;
      if (state.checklistKey) {
        var done = !!p.checklist[state.checklistKey];
        if (state.checklistStatus === 'splneno' && !done) return false;
        if (state.checklistStatus === 'nesplneno' && done) return false;
      }
      return true;
    });
  }

  function openDetail(sheetRow) {

    // hráčů" Drive folder is shared with their account for read access.
    var p = DATA.players.find(function(x) { return x.sheetRow === sheetRow; });
    if (p && p.checklist['FOTO PC'] && !p.photoDataUrl) importPlayerPhoto(p, true);
  }

  // Minimal history integration: every navigation away from the list pushes one history
  // entry, so the browser/phone back gesture ("Nefunguje zpět") does something sensible —
  // it lands back on the list — instead of leaving the app entirely (there was previously no
  // history.pushState anywhere, so back had nothing of the app's own to go back to).
  var navDepth = 0;
  function pushSubView() {
    navDepth++;
    try { history.pushState({ fksNavDepth: navDepth }, ''); } catch (e) {}
  }
  window.addEventListener('popstate', function() {
    navDepth = Math.max(0, navDepth - 1);
    state.view = 'list';
    state.selectedRow = null;
    render();
  });
  function backToList() {
    state.view = 'list';
    state.selectedRow = null;
    if (navDepth > 0) { history.back(); } else { render(); }
    render();
  }

  // ---------- Mapa hráčů (Google Maps JavaScript API + Geocoding API, addresses geocoded client-side) ----------
  function loadGeocodeCache() {
    try { geocodeCache = JSON.parse(localStorage.getItem('fks_geocode_cache_gmaps_v2') || '{}'); } catch (e) { geocodeCache = {}; }
  }
  function saveGeocodeCache() {
    try { localStorage.setItem('fks_geocode_cache_gmaps_v2', JSON.stringify(geocodeCache)); } catch (e) {}
  }
  function addressKey(p) {
    return [p.ulice, p.cp, p.mesto, p.psc].filter(Boolean).join(', ');
  }
  function loadGoogleMaps() {
    if (googleMapsLoadPromise) return googleMapsLoadPromise;
    googleMapsLoadPromise = new Promise(function(resolve, reject) {
      if (window.google && window.google.maps) { resolve(window.google); return; }
      window.__onGoogleMapsLoaded = function() { resolve(window.google); };
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + GOOGLE_MAPS_API_KEY + '&callback=__onGoogleMapsLoaded&loading=async';
      script.async = true;
      script.defer = true;
      script.onerror = function() { googleMapsLoadPromise = null; reject(new Error('load-failed')); };
      document.head.appendChild(script);
    });
    return googleMapsLoadPromise;
  }
  var geocoderInstance = null;
  function geocodeAddress(addr) {
    // Uses the client-side google.maps.Geocoder (part of the Maps JavaScript API bundle),
    // NOT the standalone Geocoding REST endpoint — that endpoint rejects HTTP-referrer-restricted
    // keys ("API keys with referer restrictions cannot be used with this API"), since referrer
    // checks only apply to browser-side JS API calls, not direct server-style REST requests.
    if (Object.prototype.hasOwnProperty.call(geocodeCache, addr)) return Promise.resolve(geocodeCache[addr]);
    return loadGoogleMaps().then(function(google) {
      if (!geocoderInstance) geocoderInstance = new google.maps.Geocoder();
      return new Promise(function(resolve) {
        geocoderInstance.geocode({ address: addr + ', Česká republika', region: 'cz' }, function(results, status) {
          var loc = null;
          if (status === 'OK' && results && results[0]) {
            var loc0 = results[0].geometry.location;
            loc = { lat: loc0.lat(), lon: loc0.lng() };
          }
          geocodeCache[addr] = loc;
          saveGeocodeCache();
          resolve(loc);
        });
      });
    }).catch(function() {
      geocodeCache[addr] = null;
      saveGeocodeCache();
      return null;
    });
  }
  function initMapIfNeeded() {
    if (mapInstance) {
      setTimeout(function() { google.maps.event.trigger(mapInstance, 'resize'); }, 0);
      return Promise.resolve();
    }
    return loadGoogleMaps().then(function(google) {
      mapInstance = new google.maps.Map(document.getElementById('mapContainer'), {
        center: { lat: 50.0343, lng: 15.7812 },
        zoom: 12,
        streetViewControl: false,
        mapTypeControl: false
      });
      markersLayer = [];
    });
  }
  function plotPlayersOnMap(players) {
    var myToken = ++mapLoadToken;
    loadGeocodeCache();
    markersLayer.forEach(function(m) { m.setMap(null); });
    markersLayer = [];
    var statusEl = document.getElementById('mapStatus');
    var done = 0, shown = 0;
    var bounds = new google.maps.LatLngBounds();
    var hasBounds = false;

    function placeMarker(p, loc) {
      var pos = { lat: loc.lat, lng: loc.lon };
      var marker = new google.maps.Marker({
        position: pos,
        map: mapInstance,
        title: p.jmenoCele,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 7,
          fillColor: p.categoryColor,
          fillOpacity: 0.85,
          strokeColor: p.categoryColor,
          strokeWeight: 2
        }
      });
      var info = new google.maps.InfoWindow({
        content: '<div style="font-family:\'Poppins\',sans-serif;font-size:12px;color:#1a1e23;"><b style="font-size:13px;">' + esc(p.jmenoCele) + '</b><br>' + esc(p.categoryGroup) + (p.mesto ? ' · ' + esc(p.mesto) : '') + '</div>'
      });
      marker.addListener('click', function() { info.open({ anchor: marker, map: mapInstance }); });
      markersLayer.push(marker);
      bounds.extend(pos);
      hasBounds = true;
      shown++;
    }

    if (!players.length) {
      if (statusEl) statusEl.textContent = '0 z 0 hráčů zobrazeno na mapě (podle adresy).';
      return;
    }

    // Geocode with a limited concurrency pool instead of one-at-a-time — cached
    // addresses resolve instantly anyway, and Google's client-side Geocoder
    // comfortably handles several in flight at once, so a full 150-player roster
    // no longer takes a minute+ to plot on every uncached load.
    var CONCURRENCY = 6;
    var nextIndex = 0;

    function worker() {
      if (myToken !== mapLoadToken) return; // a newer map load superseded this one
      var i = nextIndex++;
      if (i >= players.length) {
        if (done >= players.length && statusEl) {
          statusEl.textContent = shown + ' z ' + players.length + ' hráčů zobrazeno na mapě (podle adresy).';
          if (hasBounds) mapInstance.fitBounds(bounds, 30);
        }
        return;
      }
      var p = players[i];
      var addr = addressKey(p);
      if (!addr) {
        done++;
        if (statusEl) statusEl.textContent = 'Načítám polohy hráčů… ' + done + '/' + players.length;
        worker();
        return;
      }
      geocodeAddress(addr).then(function(loc) {
        if (myToken !== mapLoadToken) return;
        done++;
        if (statusEl) statusEl.textContent = 'Načítám polohy hráčů… ' + done + '/' + players.length;
        if (loc) placeMarker(p, loc);
        if (done >= players.length) {
          statusEl.textContent = shown + ' z ' + players.length + ' hráčů zobrazeno na mapě (podle adresy).';
          if (hasBounds) mapInstance.fitBounds(bounds, 30);
        }
        worker();
      });
    }

    for (var w = 0; w < Math.min(CONCURRENCY, players.length); w++) worker();
  }
  function renderMapView() {
    return '<div class="header"><h1>Mapa hráčů</h1><div class="count" id="mapStatus">Načítám mapu…</div></div>' +

  function renderCategoryOverlapWarning_() {

  }
  // Custom color picker: replaces the native <input type="color"> OS dialog with a small
  // rounded swatch button that opens a popover of curated preset colors plus a hex field.
  // A hidden text input still carries the actual value under data-field="color" (or a given
  // id), so existing read sites (saveCategoryRules, addCategoryRow) keep working unchanged.
  var COLOR_PRESETS_ = ['#F87171','#FB923C','#FBBF24','#FACC15','#A3E635','#4ADE80',
    '#34D399','#2DD4BF','#22D3EE','#38BDF8','#60A5FA','#818CF8',
    '#A78BFA','#C084FC','#E879F9','#F472B6','#FB7185','#94A3B8'];
  function colorSwatchHtml_(value, hiddenAttrsStr) {
    var v = value || '#38BDF8';
    return '<span class="color-swatch-wrap">' +
      '<button type="button" class="color-swatch" style="background:' + esc(v) + ';" onclick="openColorPicker(this)" aria-label="Vybrat barvu"></button>' +
      '<input type="hidden" value="' + esc(v) + '" ' + hiddenAttrsStr + '>' +
    '</span>';
  }
  var activeColorBtn_ = null;
  function closeColorPicker_() {
    var pop = document.getElementById('colorPopover');
    if (pop) pop.remove();
    activeColorBtn_ = null;
    document.removeEventListener('mousedown', colorPickerOutsideHandler_, true);
    document.removeEventListener('keydown', colorPickerEscHandler_, true);
  }
  function colorPickerOutsideHandler_(e) {
    var pop = document.getElementById('colorPopover');
    if (pop && !pop.contains(e.target) && e.target.getAttribute('data-swatch-open') !== '1') closeColorPicker_();
  }
  function colorPickerEscHandler_(e) {
    if (e.key === 'Escape') closeColorPicker_();
  }
  function openColorPicker(btn) {
    if (activeColorBtn_ === btn) { closeColorPicker_(); return; }
    closeColorPicker_();
    activeColorBtn_ = btn;
    var hidden = btn.nextElementSibling;
    var current = hidden.value || '#38BDF8';
    var rect = btn.getBoundingClientRect();
    var pop = document.createElement('div');
    pop.id = 'colorPopover';
    pop.className = 'color-popover';
    var left = rect.left;
    if (left + 208 > window.innerWidth - 8) left = window.innerWidth - 216;
    if (left < 8) left = 8;
    var top = rect.bottom + 8;
    if (top + 140 > window.innerHeight - 8) top = rect.top - 148;
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
    pop.innerHTML =
      '<div class="color-popover-grid">' +
        COLOR_PRESETS_.map(function(c) {
          return '<button type="button" style="background:' + c + ';" class="' + (c.toLowerCase() === current.toLowerCase() ? 'active' : '') + '" data-swatch-open="1" onclick="pickColor_(this, \'' + c + '\')"></button>';
        }).join('') +
      '</div>' +
      '<div class="color-popover-hex">' +
        '<span class="color-swatch-preview" id="colorPopoverPreview" data-swatch-open="1" style="background:' + esc(current) + ';"></span>' +
        '<input type="text" id="colorPopoverHex" data-swatch-open="1" value="' + esc(current) + '" maxlength="7" placeholder="#38BDF8">' +
      '</div>';
    document.body.appendChild(pop);
    document.getElementById('colorPopoverHex').addEventListener('input', function() {
      var v = this.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(v)) {
        document.getElementById('colorPopoverPreview').style.background = v;
        applyColorChoice_(v);
      }
    });
    setTimeout(function() {
      document.addEventListener('mousedown', colorPickerOutsideHandler_, true);
      document.addEventListener('keydown', colorPickerEscHandler_, true);
    }, 0);
  }
  function pickColor_(swatchBtn, color) {
    applyColorChoice_(color);

    if (hexInput) hexInput.value = color;
    var preview = document.getElementById('colorPopoverPreview');
    if (preview) preview.style.background = color;
    var pop = document.getElementById('colorPopover');
    if (pop) Array.prototype.forEach.call(pop.querySelectorAll('.color-popover-grid button'), function(b) { b.classList.remove('active'); });
    swatchBtn.classList.add('active');

  function applyColorChoice_(color) {

  // The "Ve filtru" checkbox applies immediately — it's a lightweight per-browser display

  function saveCategoryRules() {
    if (!DATA || DATA.role !== 'admin') return;
    var statusEl = document.getElementById('catSaveStatus');
    if (statusEl) statusEl.textContent = 'Ukládám…';
    var catCol = DATA.categoryCol;
    if (catCol == null || catCol < 0) {
      if (statusEl) statusEl.textContent = 'Sloupce kategorií v listu "Kategorie" nebyly nalezeny.';
      return;
    }
    // Only od/do (and, for a brand-new category, the label itself) are ever written back to
    // the "Kategorie" sheet — the columns right after the label are already in use for
    // Petr's own in-progress "Nově" (next season) block, so color and "zobrazit jako" are
    // never written there; they're kept in this browser's localStorage for every category,
    // sheet-backed or not (see loadCategoryColorOverrides_ / saveCategoryColorOverrides_).
    var writes = [];
    var localOverrides = loadCategoryColorOverrides_();
    var maxSheetRow = 2; // header rows are 1–2; data starts at row 3
    document.querySelectorAll('#main tr[data-rule-id]').forEach(function(row) {
      var sheetRow = Number(row.getAttribute('data-sheet-row'));
      var label = row.getAttribute('data-label');
      var sheetBacked = row.getAttribute('data-sheet-backed') === '1';
      var color = row.querySelector('[data-field="color"]').value;
      var display = row.querySelector('[data-field="display"]').value.trim();
      var showFilterEl = row.querySelector('[data-field="showFilter"]');
      var hideFilter = showFilterEl ? !showFilterEl.checked : false;
      localOverrides[label] = { color: color, display: display || null, hideFilter: hideFilter };
      if (!sheetBacked) return;
      if (sheetRow > maxSheetRow) maxSheetRow = sheetRow;
      var del = row.querySelector('[data-field="delete"]').checked;
      if (del) {
        writes.push({ range: 'Kategorie!' + colIndexToLetter(catCol + 2) + sheetRow, values: [['']] });
        delete localOverrides[label];
        return;
      }
      var fromEl = row.querySelector('[data-field="from"]'), toEl = row.querySelector('[data-field="to"]');
      var from = fromEl ? fromEl.value : '';
      var to = toEl ? toEl.value : '';
      writes.push({ range: 'Kategorie!' + colIndexToLetter(catCol) + sheetRow + ':' + colIndexToLetter(catCol + 1) + sheetRow,
        values: [[from, to]] });
    });
    pendingNewCategories.forEach(function(nc) {
      maxSheetRow++;
      localOverrides[nc.label] = { color: nc.color, display: nc.display || null };
      writes.push({ range: 'Kategorie!' + colIndexToLetter(catCol) + maxSheetRow + ':' + colIndexToLetter(catCol + 2) + maxSheetRow,
        values: [[nc.from != null ? nc.from : '', nc.to != null ? nc.to : '', nc.label]] });
    });
    saveCategoryColorOverrides_(localOverrides);
    if (!writes.length) {
      if (statusEl) statusEl.textContent = 'Uloženo (jen barvy kategorií bez řádku v listu).';
      pendingNewCategories = [];
      loadData();
      return;
    }
    fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: writes })
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
      return r.json();
    }).then(function() {
      pendingNewCategories = [];
      if (statusEl) statusEl.textContent = 'Uloženo.';
      loadData();
    }).catch(function(err) {
      if (statusEl) statusEl.textContent = 'Uložení selhalo: ' + err.message;
    });
  }

  // One-time backfill: import a photo for every current player who doesn't have one
  // cached yet, then mark "FOTO PC" for whoever was found in a single batched write
  // (not one write per player). Newly added players going forward are handled
  // individually via toggleChecklistItem when "FOTO PC" is checked.
  function bulkImportAllPhotos() {
    if (!DATA || DATA.role !== 'admin') return;
    var statusEl = document.getElementById('bulkPhotoStatus');
    var players = DATA.players;
    var total = players.length;
    var done = 0, found = 0, alreadyHad = 0, notFound = 0;
    var toMark = [];
    function updateStatus() {
      if (statusEl) statusEl.textContent = 'Importuji fotky… ' + done + '/' + total + ' (nově nalezeno ' + found + ', nenalezeno ' + notFound + ')';
    }
    updateStatus();
    ensurePhotoIndex().then(function() {
      return new Promise(function(resolveAll) {
        var CONCURRENCY = 5;
        var nextIndex = 0;
        function worker() {
          var i = nextIndex++;
          if (i >= players.length) { if (done >= players.length) resolveAll(); return; }
          var p = players[i];
          if (p.photoDataUrl) {
            done++; alreadyHad++; updateStatus(); worker();
            return;
          }
          importPlayerPhoto(p, true, true).then(function(gotPhoto) {
            done++;
            if (gotPhoto) {
              found++;
              if (!p.checklist['FOTO PC']) {
                var colIdx = DATA.colIndex.checklistCols ? DATA.colIndex.checklistCols['FOTO PC'] : -1;
                if (colIdx != null && colIdx >= 0) {
                  toMark.push('Seznam!' + colIndexToLetter(colIdx) + p.sheetRow);
                  p.checklist['FOTO PC'] = true;
                }
              }
            } else {
              notFound++;
            }
            updateStatus();
            worker();
          });
        }
        for (var w = 0; w < Math.min(CONCURRENCY, players.length); w++) worker();
      });
    }).then(function() {
      if (!toMark.length) {
        if (statusEl) statusEl.textContent = 'Hotovo. Nově naimportováno ' + found + ' fotek, ' + alreadyHad + ' už bylo dřív, ' + notFound + ' nenalezeno.';
        pushNotification('Hromadný import fotek dokončen: ' + found + ' nových, ' + notFound + ' nenalezeno.', found ? 'info' : 'warn');
        return;
      }
      return fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: toMark.map(function(range) { return { range: range, values: [[true]] }; }) })
      }).then(function(r) {
        if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
        return r.json();
      }).then(function() {
        if (statusEl) statusEl.textContent = 'Hotovo. Nově naimportováno ' + found + ' fotek (checklist "FOTO PC" označen), ' + alreadyHad + ' už bylo dřív, ' + notFound + ' nenalezeno.';
        pushNotification('Hromadný import fotek dokončen: ' + found + ' nových (checklist aktualizován), ' + notFound + ' nenalezeno.', 'info');
      });
    }).catch(function(err) {
      if (statusEl) statusEl.textContent = 'Import selhal: ' + err.message;
      pushNotification('Hromadný import fotek selhal: ' + err.message, 'error');
    });
  }

  function handleImportFile(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        importCandidates = rows.map(parseKisRow).filter(function(c) { return c.jmeno || c.prijmeni; });
        renderImportPreview();
        pushNotification('Soubor "' + file.name + '" načten — nalezeno ' + importCandidates.length + ' záznamů k importu.', 'info');
      } catch (err) {
        var el = document.getElementById('importPreview');
        if (el) el.innerHTML = '<div class="diff-summary" style="color:var(--red);">Soubor se nepodařilo přečíst: ' + esc(err.message) + '</div>';
        pushNotification('Import souboru "' + file.name + '" selhal: ' + err.message, 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function parseKisRow(row) {
    var jmeno = (row['Jméno'] || '').toString().trim();
    var prijmeni = (row['Příjmení'] || '').toString().trim();
    var birth = row['Datum narození'];
    var birthDate = (birth instanceof Date) ? birth : null;
    var rok = birthDate ? birthDate.getFullYear() : '';
    var rule = (birthDate && DATA && DATA.categoryRules) ? matchCategoryRule_(rok, DATA.categoryRules) : null;
    return {
      jmeno: jmeno,
      prijmeni: prijmeni,
      datumNarozeni: birthDate ? formatCzechDate(birthDate) : (row['Datum narození'] || '').toString(),
      rok: rok,
      categoryPreview: rule ? rule.label : '(nezjištěno — zkontrolujte ročník v tabulce)',
      emailHrac: (row['E-mail'] || '').toString().trim(),
      telefonHrac: (row['Telefon'] || '').toString().trim(),
      ulice: (row['Ulice'] || '').toString().trim(),
      cp: (row['Číslo popisné'] || '').toString().trim(),
      mesto: (row['Město / obec'] || row['Město'] || '').toString().trim(),
      psc: (row['PSČ'] || '').toString().trim(),
      zastupceJmeno: (row['Rodič - jméno'] || '').toString().trim(),
      zastupceEmail: (row['Rodič - E-mail'] || row['Rodič - e-mail'] || '').toString().trim(),
      zastupceTelefon: (row['Rodič - telefon'] || '').toString().trim(),
      _added: false
    };
  }
