  // ---------- Sharing (PDF via browser print, or plain-text copy) with a choice of which
  // fields to include — Jméno is always included; everything else is opt-in via checkboxes,
  // remembered in localStorage so the choice doesn't have to be repeated every time. ----------
  var SHARE_FIELD_DEFS = [
    { key: 'kategorie', label: 'Kategorie a ročník' },
    { key: 'datumNarozeni', label: 'Datum narození a věk' },
    { key: 'adresa', label: 'Adresa' },
    { key: 'id', label: 'FAČR ID' },
    { key: 'rodneCislo', label: 'Rodné číslo' },
    { key: 'telefonHrac', label: 'Telefon hráče' },
    { key: 'emailHrac', label: 'E-mail hráče' },
    { key: 'zastupce', label: 'Zákonný zástupce (jméno, telefon, e-mail)' },
    { key: 'checklist', label: 'Stav registračního checklistu' }
  ];
  var DEFAULT_SHARE_FIELDS = { kategorie: true, datumNarozeni: true, adresa: true, id: false, rodneCislo: false, telefonHrac: false, emailHrac: false, zastupce: false, checklist: false };
  var SHARE_FIELDS_STATE_KEY = 'fks_share_fields_v1';
  var shareModalPlayers_ = [];

  function loadShareFieldsState_() {
    var out = {};
    for (var k in DEFAULT_SHARE_FIELDS) out[k] = DEFAULT_SHARE_FIELDS[k];
    try {
      var saved = JSON.parse(localStorage.getItem(SHARE_FIELDS_STATE_KEY) || '{}');
      for (var k2 in saved) if (out.hasOwnProperty(k2)) out[k2] = !!saved[k2];
    } catch (e) {}
    return out;
  }
  function saveShareFieldsState_(map) { try { localStorage.setItem(SHARE_FIELDS_STATE_KEY, JSON.stringify(map)); } catch (e) {} }

  function addressLine_(p) {
    return [p.ulice, p.cp].filter(Boolean).join(' ') + (p.mesto ? (p.ulice || p.cp ? ', ' : '') + p.mesto : '') + (p.psc ? ' ' + p.psc : '');
  }

  function openShareOptionsModal_(players) {
    if (!players || !players.length) { pushNotification('Nejsou vybraní žádní hráči ke sdílení.', 'warn'); return; }
    shareModalPlayers_ = players;
    var title = players.length === 1 ? ('Sdílet hráče: ' + players[0].jmenoCele) : ('Sdílet hráče (' + players.length + ')');
    document.getElementById('modalBox').innerHTML =
      '<h2>' + esc(title) + '</h2>' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:12px;">Jméno se sdílí vždy. Zaškrtněte, co dalšího se má zahrnout:</div>' +
      '<div id="shareFieldsGrid" class="share-fields-grid"></div>' +
      '<div class="modal-actions">' +
        '<button class="icon-btn toolbar-btn" onclick="closeModal()">Zrušit</button>' +
        '<button class="icon-btn toolbar-btn" onclick="confirmShareCopyText_()">Zkopírovat text</button>' +
        '<button class="icon-btn toolbar-btn" onclick="confirmSharePDF_()">PDF</button>' +
      '</div>';
    renderShareFieldsGrid_();
    document.getElementById('modalOverlay').classList.add('open');
  }
  function renderShareFieldsGrid_() {
    var el = document.getElementById('shareFieldsGrid');
    if (!el) return;
    var fields = loadShareFieldsState_();
    el.innerHTML = SHARE_FIELD_DEFS.map(function(f) {
      return '<label class="share-field-row"><input type="checkbox" onchange="toggleShareField_(\'' + f.key + '\', this.checked)"' + (fields[f.key] ? ' checked' : '') + '> ' + esc(f.label) + '</label>';
    }).join('');
  }
  function toggleShareField_(key, checked) {
    var fields = loadShareFieldsState_();
    fields[key] = !!checked;
    saveShareFieldsState_(fields);
  }

  function playerShareValues_(p, fields) {
    var parts = [];
    if (fields.kategorie) parts.push({ label: 'Kategorie', value: p.categoryGroup + (p.kategorie ? ' (' + p.kategorie + ')' : '') + (p.rok ? ' · ročník ' + p.rok : '') });
    if (fields.datumNarozeni) parts.push({ label: 'Datum narození', value: p.datumNarozeni + (p.vek ? ' (' + p.vek + ' let)' : '') });
    if (fields.adresa) parts.push({ label: 'Adresa', value: addressLine_(p) || '—' });
    if (fields.id) parts.push({ label: 'FAČR ID', value: p.id || '—' });
    if (fields.rodneCislo) parts.push({ label: 'Rodné číslo', value: formatRodneCislo_(p.rodneCislo) || '—' });
    if (fields.telefonHrac) parts.push({ label: 'Telefon hráče', value: p.telefonHrac || '—' });
    if (fields.emailHrac) parts.push({ label: 'E-mail hráče', value: p.emailHrac || '—' });
    if (fields.zastupce) parts.push({ label: 'Zákonný zástupce', value: [p.zastupceJmeno, p.zastupceTelefon, p.zastupceEmail].filter(Boolean).join(', ') || '—' });
    if (fields.checklist) { var c = checklistCounts(p); parts.push({ label: 'Checklist', value: c.done + '/' + c.total + ' hotovo' }); }
    return parts;
  }

  function confirmSharePDF_() {
    var players = shareModalPlayers_;
    var fields = loadShareFieldsState_();
    closeModal();
    var html;
    if (players.length === 1) {
      var p = players[0];
      var rows = playerShareValues_(p, fields).map(function(row) {
        return '<tr><td><b>' + esc(row.label) + '</b></td><td>' + esc(row.value) + '</td></tr>';
      }).join('');
      html = '<h1>FK Slovany Pardubice — Karta hráče</h1>' +
        '<div class="meta">Vygenerováno ' + new Date().toLocaleDateString('cs-CZ') + '</div>' +
        '<table><tbody><tr><td><b>Jméno</b></td><td>' + esc(p.jmenoCele) + '</td></tr>' + rows + '</tbody></table>';
    } else {
      var activeDefs = SHARE_FIELD_DEFS.filter(function(f) { return fields[f.key]; });
      var head = '<th>Č.</th><th>Jméno</th>' + activeDefs.map(function(f) { return '<th>' + esc(f.label) + '</th>'; }).join('');
      var rowsHtml = players.map(function(p, i) {
        var values = playerShareValues_(p, fields);
        var cells = activeDefs.map(function(f) {
          var v = values.find(function(row) { return row.label === f.label; });
          return '<td>' + esc(v ? v.value : '—') + '</td>';
        }).join('');
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(p.jmenoCele) + '</td>' + cells + '</tr>';
      }).join('');
      var title = state.categories.length ? ('Soupiska: ' + state.categories.map(displayCategoryLabel).join(', ')) : 'Soupiska hráčů';
      html = '<h1>FK Slovany Pardubice</h1>' +
        '<div class="meta">' + esc(title) + ' · vygenerováno ' + new Date().toLocaleDateString('cs-CZ') + ' · ' + players.length + ' hráčů</div>' +
        '<table><thead><tr>' + head + '</tr></thead><tbody>' + rowsHtml + '</tbody></table>';
    }
    document.getElementById('printArea').innerHTML = html;
    window.print();
  }

  function confirmShareCopyText_() {
    var players = shareModalPlayers_;
    var fields = loadShareFieldsState_();
    closeModal();
    var multi = players.length > 1;
    var blocks = players.map(function(p, i) {
      var values = playerShareValues_(p, fields);
      var lines = values.map(function(row) { return '  ' + row.label + ': ' + row.value; });
      return (multi ? (i + 1) + '. ' : '') + p.jmenoCele + (lines.length ? '\n' + lines.join('\n') : '');
    });
    var header = 'FK Slovany Pardubice' + (multi ? ' — Soupiska (' + players.length + ' hráčů)' : ' — Karta hráče') + ' · ' + new Date().toLocaleDateString('cs-CZ');
    var text = header + '\n\n' + blocks.join('\n\n');
    function done() { pushNotification('Text zkopírován do schránky (' + players.length + (players.length === 1 ? ' hráč' : ' hráčů') + ').', 'info'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function() { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }

  // ---------- Editace údajů hráče (zapisuje vybrané změněné buňky zpět do Sheetu) ----------
  var EDIT_FIELDS = ['id', 'rodneCislo', 'telefonHrac', 'emailHrac', 'zastupceJmeno', 'zastupceTelefon', 'zastupceEmail', 'zastupce2Jmeno', 'zastupce2Telefon', 'zastupce2Email', 'ulice', 'cp', 'mesto', 'psc'];
  var EDIT_FIELD_LABELS = { id: 'FAČR ID', rodneCislo: 'Rodné číslo', telefonHrac: 'Telefon hráče', emailHrac: 'E-mail hráče', zastupceJmeno: 'Zástupce – jméno', zastupceTelefon: 'Zástupce – telefon', zastupceEmail: 'Zástupce – e-mail', zastupce2Jmeno: '2. zástupce – jméno', zastupce2Telefon: '2. zástupce – telefon', zastupce2Email: '2. zástupce – e-mail', ulice: 'Ulice', cp: 'Číslo popisné', mesto: 'Obec', psc: 'PSČ' };

  function openEditModal(sheetRow) {
    var p = DATA.players.find(function(x) { return x.sheetRow === sheetRow; });
    if (!p) return;
    document.getElementById('modalBox').innerHTML = editFormHtml(p);
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('modalBox').innerHTML = '';
  }
  function editFormHtml(p) {
    function field(id, label, value) {
      return '<div class="form-row"><label for="ef_' + id + '">' + esc(label) + '</label><input id="ef_' + id + '" type="text" value="' + esc(value || '') + '"></div>';
    }
    return '<h2>Upravit údaje — ' + esc(p.jmenoCele) + '</h2>' +
      field('id', EDIT_FIELD_LABELS.id, p.id) +
      field('rodneCislo', EDIT_FIELD_LABELS.rodneCislo, p.rodneCislo) +
      field('telefonHrac', EDIT_FIELD_LABELS.telefonHrac, p.telefonHrac) +
      field('emailHrac', EDIT_FIELD_LABELS.emailHrac, p.emailHrac) +
      field('zastupceJmeno', EDIT_FIELD_LABELS.zastupceJmeno, p.zastupceJmeno) +
      field('zastupceTelefon', EDIT_FIELD_LABELS.zastupceTelefon, p.zastupceTelefon) +
      field('zastupceEmail', EDIT_FIELD_LABELS.zastupceEmail, p.zastupceEmail) +
      field('zastupce2Jmeno', EDIT_FIELD_LABELS.zastupce2Jmeno, p.zastupce2Jmeno) +
      field('zastupce2Telefon', EDIT_FIELD_LABELS.zastupce2Telefon, p.zastupce2Telefon) +
      field('zastupce2Email', EDIT_FIELD_LABELS.zastupce2Email, p.zastupce2Email) +
      field('ulice', EDIT_FIELD_LABELS.ulice, p.ulice) +
      field('cp', EDIT_FIELD_LABELS.cp, p.cp) +
      field('mesto', EDIT_FIELD_LABELS.mesto, p.mesto) +
      field('psc', EDIT_FIELD_LABELS.psc, p.psc) +
      '<div id="editDiffArea"></div>' +
      '<div class="modal-actions">' +
        '<button class="icon-btn toolbar-btn" onclick="closeModal()">Zrušit</button>' +
        '<button class="icon-btn toolbar-btn" style="background:var(--accent);color:#06181a;border-color:var(--accent);" onclick="reviewEdits(' + p.sheetRow + ')">Zkontrolovat a uložit</button>' +
      '</div>';
  }
  function reviewEdits(sheetRow) {
    var p = DATA.players.find(function(x) { return x.sheetRow === sheetRow; });
    if (!p) return;
    var changes = {};
    EDIT_FIELDS.forEach(function(key) {
      var el = document.getElementById('ef_' + key);
      if (!el) return;
      var newVal = el.value.trim();
      var oldVal = (p[key] || '').toString();
      if (newVal !== oldVal) changes[key] = newVal;
    });
    var keys = Object.keys(changes);
    var area = document.getElementById('editDiffArea');
    if (!keys.length) {
      area.innerHTML = '<div class="diff-summary">Žádné změny k uložení.</div>';
      return;
    }
    area.innerHTML = '<div class="diff-summary"><b>Zkontrolujte změny:</b>' +
      keys.map(function(k) {
        return '<div>' + esc(EDIT_FIELD_LABELS[k] || k) + ': "' + esc(p[k] || '—') + '" → "' + esc(changes[k] || '—') + '"</div>';
      }).join('') + '</div>' +
      '<div class="modal-actions">' +
        '<button class="icon-btn toolbar-btn" onclick="closeModal()">Zrušit</button>' +
        '<button class="icon-btn toolbar-btn" id="confirmSaveBtn" style="background:var(--accent);color:#06181a;border-color:var(--accent);">Potvrdit a uložit</button>' +
      '</div>';
    document.getElementById('confirmSaveBtn').onclick = function() { saveEditsToSheet(sheetRow, changes); };
  }
  function saveEditsToSheet(sheetRow, changes) {
    var p = DATA.players.find(function(x) { return x.sheetRow === sheetRow; });
    var area = document.getElementById('editDiffArea');
    if (!p || !DATA.colIndex) { area.innerHTML = '<div class="diff-summary">Chyba: chybí informace o sloupcích.</div>'; return; }
    area.innerHTML = '<div class="diff-summary">Ukládám…</div>';
    var dataArr = [];
    Object.keys(changes).forEach(function(key) {
      var colIdx = DATA.colIndex[key];
      if (colIdx == null || colIdx < 0) return;
      dataArr.push({ range: 'Seznam!' + colIndexToLetter(colIdx) + sheetRow, values: [[changes[key]]] });
    });
    if (!dataArr.length) {
      area.innerHTML = '<div class="diff-summary">Tyto položky appka zatím neumí uložit (sloupec v tabulce nenalezen).</div>';
      return;
    }
    fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: dataArr })
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
      return r.json();
    }).then(function() {
      Object.keys(changes).forEach(function(key) { p[key] = changes[key]; });
      pushNotification('Uloženy změny u hráče ' + p.jmenoCele + '.', 'info');
      closeModal();
      render();
    }).catch(function(err) {
      area.innerHTML = '<div class="diff-summary" style="color:var(--red);">Uložení selhalo: ' + esc(err.message) + '</div>' +
        '<div class="modal-actions"><button class="icon-btn toolbar-btn" onclick="closeModal()">Zavřít</button></div>';
      pushNotification('Uložení změn u hráče ' + p.jmenoCele + ' selhalo: ' + err.message, 'error');
    });
  }

  // ---------- Registrační checklist — klikací zaškrtávání (admin only) ----------
  // Clicking a checklist row first asks for confirmation (a real click is easy to fire by
  // accident on a touch screen), then writes straight back to the matching "Seznam" sheet
  // cell. Checking "FOTO PC" additionally triggers a one-time photo import for that player
  // (see importPlayerPhoto above). For every item in CHECKLIST_DATE_KEYS (now all checklist
  // items), checking it also stamps today's date into its own "<KEY> DATUM" column.
  function toggleChecklistItem(sheetRow, key) {
    if (!DATA || DATA.role !== 'admin') return;
    var p = DATA.players.find(function(x) { return x.sheetRow === sheetRow; });
    if (!p) return;
    var newVal = !p.checklist[key];
    var label = CHECKLIST_LABELS[key] || key;
    document.getElementById('modalBox').innerHTML =
      '<h2>Potvrzení</h2>' +
      '<div style="font-size:13px;margin-bottom:18px;">Opravdu chcete u hráče <b>' + esc(p.jmenoCele) + '</b> nastavit "' + esc(label) + '" na <b>' + (newVal ? 'ANO' : 'NE') + '</b>?</div>' +
      '<div class="modal-actions">' +
        '<button class="icon-btn toolbar-btn" onclick="closeModal()">Zrušit</button>' +
        '<button class="icon-btn toolbar-btn" style="background:var(--accent);color:#06181a;border-color:var(--accent);" onclick="closeModal();applyChecklistToggle_(' + sheetRow + ', \'' + jsStr(key) + '\', ' + newVal + ')">Potvrdit</button>' +
      '</div>';
    document.getElementById('modalOverlay').classList.add('open');
  }
  function applyChecklistToggle_(sheetRow, key, newVal) {
    if (!DATA || DATA.role !== 'admin') return;
    var p = DATA.players.find(function(x) { return x.sheetRow === sheetRow; });
    if (!p) return;
    var colIdx = DATA.colIndex && DATA.colIndex.checklistCols ? DATA.colIndex.checklistCols[key] : -1;
    if (colIdx == null || colIdx < 0) {
      pushNotification('Sloupec pro "' + (CHECKLIST_LABELS[key] || key) + '" nebyl v tabulce nalezen.', 'error');
      return;
    }
    var writes = [{ range: 'Seznam!' + colIndexToLetter(colIdx) + sheetRow, values: [[newVal]] }];
    var isDateTracked = CHECKLIST_DATE_KEYS.indexOf(key) !== -1;
    var dateColIdx = isDateTracked && DATA.colIndex.checklistDateCols ? DATA.colIndex.checklistDateCols[key] : -1;
    var newDate = null;
    if (isDateTracked && newVal === true && dateColIdx != null && dateColIdx >= 0) {
      newDate = formatDateCz_();
      writes.push({ range: 'Seznam!' + colIndexToLetter(dateColIdx) + sheetRow, values: [[newDate]] });
    }
    fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: writes })
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
      return r.json();
    }).then(function() {
      p.checklist[key] = newVal;
      if (newDate != null && p.checklistDates) p.checklistDates[key] = newDate;
      render();
      if (key === 'FOTO PC' && newVal === true) importPlayerPhoto(p);
    }).catch(function(err) {
      pushNotification('Uložení položky "' + (CHECKLIST_LABELS[key] || key) + '" u hráče ' + p.jmenoCele + ' selhalo: ' + err.message, 'error');
    });
  }

  // ---------- Mapa hráčů (Google Maps JavaScript API + Geocoding API, addresses geocoded client-side) ----------
  function loadGeocodeCache() {
    try { geocodeCache = JSON.parse(localStorage.getItem('fks_geocode_cache_gmaps_v2') || '{}'); } catch (e) { geocodeCache = {}; }
  }
  function saveGeocodeCache() {
    try { localStorage.setItem('fks_geocode_cache_gmaps_v2', JSON.stringify(geocodeCache)); } catch (e) {}
  }
  function addressKey(p) {
    return [p.ulice, p.cp, p.mesto, p.psc].filter(Boolean).join(', ');
  }
  function loadGoogleMaps() {
    if (googleMapsLoadPromise) return googleMapsLoadPromise;
    googleMapsLoadPromise = new Promise(function(resolve, reject) {
      if (window.google && window.google.maps) { resolve(window.google); return; }
      window.__onGoogleMapsLoaded = function() { resolve(window.google); };
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + GOOGLE_MAPS_API_KEY + '&callback=__onGoogleMapsLoaded&loading=async';
      script.async = true;
      script.defer = true;
      script.onerror = function() { googleMapsLoadPromise = null; reject(new Error('load-failed')); };
      document.head.appendChild(script);
    });
    return googleMapsLoadPromise;
  }
  var geocoderInstance = null;
  function geocodeAddress(addr) {
    // Uses the client-side google.maps.Geocoder (part of the Maps JavaScript API bundle),
    // NOT the standalone Geocoding REST endpoint — that endpoint rejects HTTP-referrer-restricted
    // keys ("API keys with referer restrictions cannot be used with this API"), since referrer
    // checks only apply to browser-side JS API calls, not direct server-style REST requests.
    if (Object.prototype.hasOwnProperty.call(geocodeCache, addr)) return Promise.resolve(geocodeCache[addr]);
    return loadGoogleMaps().then(function(google) {
      if (!geocoderInstance) geocoderInstance = new google.maps.Geocoder();
      return new Promise(function(resolve) {
        geocoderInstance.geocode({ address: addr + ', Česká republika', region: 'cz' }, function(results, status) {
          var loc = null;
          if (status === 'OK' && results && results[0]) {
            var loc0 = results[0].geometry.location;
            loc = { lat: loc0.lat(), lon: loc0.lng() };
          }
          geocodeCache[addr] = loc;
          saveGeocodeCache();
          resolve(loc);
        });
      });
    }).catch(function() {
      geocodeCache[addr] = null;
      saveGeocodeCache();
      return null;
    });
  }
  function initMapIfNeeded() {
    if (mapInstance) {
      setTimeout(function() { google.maps.event.trigger(mapInstance, 'resize'); }, 0);
      return Promise.resolve();
    }
    return loadGoogleMaps().then(function(google) {
      mapInstance = new google.maps.Map(document.getElementById('mapContainer'), {
        center: { lat: 50.0343, lng: 15.7812 },
        zoom: 12,
        streetViewControl: false,
        mapTypeControl: false
      });
      markersLayer = [];
    });
  }
  function plotPlayersOnMap(players) {
    var myToken = ++mapLoadToken;
    loadGeocodeCache();
    markersLayer.forEach(function(m) { m.setMap(null); });
    markersLayer = [];
    var statusEl = document.getElementById('mapStatus');
    var done = 0, shown = 0;
    var bounds = new google.maps.LatLngBounds();
    var hasBounds = false;

    function placeMarker(p, loc) {
      var pos = { lat: loc.lat, lng: loc.lon };
      var marker = new google.maps.Marker({
        position: pos,
        map: mapInstance,
        title: p.jmenoCele,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 7,
          fillColor: p.categoryColor,
          fillOpacity: 0.85,
          strokeColor: p.categoryColor,
          strokeWeight: 2
        }
      });
      var info = new google.maps.InfoWindow({
        content: '<div style="font-family:\'Poppins\',sans-serif;font-size:12px;color:#1a1e23;"><b style="font-size:13px;">' + esc(p.jmenoCele) + '</b><br>' + esc(p.categoryGroup) + (p.mesto ? ' · ' + esc(p.mesto) : '') + '</div>'
      });
      marker.addListener('click', function() { info.open({ anchor: marker, map: mapInstance }); });
      markersLayer.push(marker);
      bounds.extend(pos);
      hasBounds = true;
      shown++;
    }

    if (!players.length) {
      if (statusEl) statusEl.textContent = '0 z 0 hráčů zobrazeno na mapě (podle adresy).';
      return;
    }

    // Geocode with a limited concurrency pool instead of one-at-a-time — cached
    // addresses resolve instantly anyway, and Google's client-side Geocoder
    // comfortably handles several in flight at once, so a full 150-player roster
    // no longer takes a minute+ to plot on every uncached load.
    var CONCURRENCY = 6;
    var nextIndex = 0;

    function worker() {
      if (myToken !== mapLoadToken) return; // a newer map load superseded this one
      var i = nextIndex++;
      if (i >= players.length) {
        if (done >= players.length && statusEl) {
          statusEl.textContent = shown + ' z ' + players.length + ' hráčů zobrazeno na mapě (podle adresy).';
          if (hasBounds) mapInstance.fitBounds(bounds, 30);
        }
        return;
      }
      var p = players[i];
      var addr = addressKey(p);
      if (!addr) {
        done++;
        if (statusEl) statusEl.textContent = 'Načítám polohy hráčů… ' + done + '/' + players.length;
        worker();
        return;
      }
      geocodeAddress(addr).then(function(loc) {
        if (myToken !== mapLoadToken) return;
        done++;
        if (statusEl) statusEl.textContent = 'Načítám polohy hráčů… ' + done + '/' + players.length;
        if (loc) placeMarker(p, loc);
        if (done >= players.length) {
          statusEl.textContent = shown + ' z ' + players.length + ' hráčů zobrazeno na mapě (podle adresy).';
          if (hasBounds) mapInstance.fitBounds(bounds, 30);
        }
        worker();
      });
    }

    for (var w = 0; w < Math.min(CONCURRENCY, players.length); w++) worker();
  }
  function renderMapView() {
    return '<div class="header"><h1>Mapa hráčů</h1><div class="count" id="mapStatus">Načítám mapu…</div></div>' +
      '<div style="font-size:11px;color:#5a6169;margin-bottom:10px;">Zobrazuje se aktuální filtr (' + (state.categories.length ? state.categories.map(displayCategoryLabel).join(', ') : 'všechny kategorie') + '). Polohy jsou přibližné odhady podle adresy, zdroj: Google Maps.</div>' +
      '<div id="mapContainer" style="height:calc(100vh - 190px); min-height:340px; border-radius:12px; overflow:hidden; border:1px solid var(--border);"></div>';
  }

  function renderCategoryOverlapWarning_() {
    var rules = (DATA.categoryRules || []).filter(function(r) { return r.from != null && r.to != null; });
    var overlaps = [];
    for (var i = 0; i < rules.length; i++) {
      for (var j = i + 1; j < rules.length; j++) {
        var a = rules[i], b = rules[j];
        if (a.from <= b.to && b.from <= a.to) overlaps.push(a.label + ' × ' + b.label + ' (' + a.from + '–' + a.to + ' / ' + b.from + '–' + b.to + ')');
      }
    }
    if (!overlaps.length) return '';
    return '<div style="background:#3a1f1f;border:1px solid #7a3b3b;color:#ffb4b4;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:10px;">' +
      '⚠ Překrývající se ročníky (u přiřazení hráče vyhrává první shoda podle pořadí v listu): ' + esc(overlaps.join('; ')) + '</div>';
  }
  // Custom color picker: replaces the native <input type="color"> OS dialog with a small
  // rounded swatch button that opens a popover of curated preset colors plus a hex field.
  // A hidden text input still carries the actual value under data-field="color" (or a given
  // id), so existing read sites (saveCategoryRules, addCategoryRow) keep working unchanged.
  var COLOR_PRESETS_ = ['#F87171','#FB923C','#FBBF24','#FACC15','#A3E635','#4ADE80',
    '#34D399','#2DD4BF','#22D3EE','#38BDF8','#60A5FA','#818CF8',
    '#A78BFA','#C084FC','#E879F9','#F472B6','#FB7185','#94A3B8'];
  function colorSwatchHtml_(value, hiddenAttrsStr) {
    var v = value || '#38BDF8';
    return '<span class="color-swatch-wrap">' +
      '<button type="button" class="color-swatch" style="background:' + esc(v) + ';" onclick="openColorPicker(this)" aria-label="Vybrat barvu"></button>' +
      '<input type="hidden" value="' + esc(v) + '" ' + hiddenAttrsStr + '>' +
    '</span>';
  }
  var activeColorBtn_ = null;
  function closeColorPicker_() {
    var pop = document.getElementById('colorPopover');
    if (pop) pop.remove();
    activeColorBtn_ = null;
    document.removeEventListener('mousedown', colorPickerOutsideHandler_, true);
    document.removeEventListener('keydown', colorPickerEscHandler_, true);
  }
  function colorPickerOutsideHandler_(e) {
    var pop = document.getElementById('colorPopover');
    if (pop && !pop.contains(e.target) && e.target.getAttribute('data-swatch-open') !== '1') closeColorPicker_();
  }
  function colorPickerEscHandler_(e) {
    if (e.key === 'Escape') closeColorPicker_();
  }
  function openColorPicker(btn) {
    if (activeColorBtn_ === btn) { closeColorPicker_(); return; }
    closeColorPicker_();
    activeColorBtn_ = btn;
    var hidden = btn.nextElementSibling;
    var current = hidden.value || '#38BDF8';
    var rect = btn.getBoundingClientRect();
    var pop = document.createElement('div');
    pop.id = 'colorPopover';
    pop.className = 'color-popover';
    var left = rect.left;
    if (left + 208 > window.innerWidth - 8) left = window.innerWidth - 216;
    if (left < 8) left = 8;
    var top = rect.bottom + 8;
    if (top + 140 > window.innerHeight - 8) top = rect.top - 148;
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
    pop.innerHTML =
      '<div class="color-popover-grid">' +
        COLOR_PRESETS_.map(function(c) {
          return '<button type="button" style="background:' + c + ';" class="' + (c.toLowerCase() === current.toLowerCase() ? 'active' : '') + '" data-swatch-open="1" onclick="pickColor_(this, \'' + c + '\')"></button>';
        }).join('') +
      '</div>' +
      '<div class="color-popover-hex">' +
        '<span class="color-swatch-preview" id="colorPopoverPreview" data-swatch-open="1" style="background:' + esc(current) + ';"></span>' +
        '<input type="text" id="colorPopoverHex" data-swatch-open="1" value="' + esc(current) + '" maxlength="7" placeholder="#38BDF8">' +
      '</div>';
    document.body.appendChild(pop);
    document.getElementById('colorPopoverHex').addEventListener('input', function() {
      var v = this.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(v)) {
        document.getElementById('colorPopoverPreview').style.background = v;
        applyColorChoice_(v);
      }
    });
    setTimeout(function() {
      document.addEventListener('mousedown', colorPickerOutsideHandler_, true);
      document.addEventListener('keydown', colorPickerEscHandler_, true);
    }, 0);
  }
  function pickColor_(swatchBtn, color) {
    applyColorChoice_(color);
    var hexInput = document.getElementById('colorPopoverHex');
    if (hexInput) hexInput.value = color;
    var preview = document.getElementById('colorPopoverPreview');
    if (preview) preview.style.background = color;
    var pop = document.getElementById('colorPopover');
    if (pop) Array.prototype.forEach.call(pop.querySelectorAll('.color-popover-grid button'), function(b) { b.classList.remove('active'); });
    swatchBtn.classList.add('active');
  }
  function applyColorChoice_(color) {
    if (!activeColorBtn_) return;
    activeColorBtn_.style.background = color;
    var hidden = activeColorBtn_.nextElementSibling;
    var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
    setter.call(hidden, color);
    hidden.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function renderCategoryEditorRows_() {
    var groups = categoryPlayerGroups_();

      var yearInputs = r.sheetBacked ?

         '<td><input type="number" class="cat-in" data-field="to" style="width:60px;" value="' + doo + '"></td>') :

      var playerList = players.length ?

      return '<tr data-rule-id="' + esc(r.id) + '" data-sheet-row="' + (r.sheetRow || '') + '" data-label="' + esc(r.label) + '" data-sheet-backed="' + (r.sheetBacked ? '1' : '0') + '">' +
        '<td>' + colorSwatchHtml_(r.color, 'class="cat-in" data-field="color"') + '</td>' +
        '<td>' + esc(r.label) + '</td>' +
        '<td><input type="text" class="cat-in" data-field="display" placeholder="' + esc(r.label) + '" value="' + (r.display !== r.label ? esc(r.display) : '') + '" style="width:80px;"></td>' +
        yearInputs +
        '<td><a href="javascript:void(0)" onclick="toggleCategoryPlayerList(this, \'' + esc(r.id) + '\')">' + players.length + '</a>' + playerList + '</td>' +
        '<td style="text-align:center;"><input type="checkbox" class="cat-in" data-field="showFilter"' + (r.hideFilter ? '' : ' checked') + ' title="Zobrazit tuto kategorii jako filtr na úvodní stránce" onchange="toggleCategoryFilterVisibility(this, \'' + jsStr(r.label) + '\')"></td>' +
        '<td>' + (r.sheetBacked ? '<input type="checkbox" class="cat-in" data-field="delete">' : '') + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="8" class="loading">Žádné kategorie nenalezeny.</td></tr>';
  }
  // The "Ve filtru" checkbox applies immediately — it's a lightweight per-browser display
  // preference (like a light switch), not a change that should wait behind the "Uložit
  // změny kategorií" button, which is for the heavier sheet writes (ročník od/do). Without

  function toggleCategoryFilterVisibility(checkbox, label) {

    var existing = overrides[label] || {};
    overrides[label] = { color: existing.color || null, display: existing.display || null, hideFilter: !checkbox.checked };

  var pendingNewCategories = [];

  function saveCategoryRules() {
    if (!DATA || DATA.role !== 'admin') return;
    var statusEl = document.getElementById('catSaveStatus');
    if (statusEl) statusEl.textContent = 'Ukládám…';
    var catCol = DATA.categoryCol;
    if (catCol == null || catCol < 0) {
      if (statusEl) statusEl.textContent = 'Sloupce kategorií v listu "Kategorie" nebyly nalezeny.';
      return;
    }
    // Only od/do (and, for a brand-new category, the label itself) are ever written back to
    // the "Kategorie" sheet — the columns right after the label are already in use for
    // Petr's own in-progress "Nově" (next season) block, so color and "zobrazit jako" are
    // never written there; they're kept in this browser's localStorage for every category,
    // sheet-backed or not (see loadCategoryColorOverrides_ / saveCategoryColorOverrides_).
    var writes = [];
    var localOverrides = loadCategoryColorOverrides_();
    var maxSheetRow = 2; // header rows are 1–2; data starts at row 3
    document.querySelectorAll('#main tr[data-rule-id]').forEach(function(row) {
      var sheetRow = Number(row.getAttribute('data-sheet-row'));
      var label = row.getAttribute('data-label');
      var sheetBacked = row.getAttribute('data-sheet-backed') === '1';
      var color = row.querySelector('[data-field="color"]').value;
      var display = row.querySelector('[data-field="display"]').value.trim();
      var showFilterEl = row.querySelector('[data-field="showFilter"]');
      var hideFilter = showFilterEl ? !showFilterEl.checked : false;
      localOverrides[label] = { color: color, display: display || null, hideFilter: hideFilter };
      if (!sheetBacked) return;
      if (sheetRow > maxSheetRow) maxSheetRow = sheetRow;
      var del = row.querySelector('[data-field="delete"]').checked;
      if (del) {
        writes.push({ range: 'Kategorie!' + colIndexToLetter(catCol + 2) + sheetRow, values: [['']] });
        delete localOverrides[label];
        return;
      }
      var fromEl = row.querySelector('[data-field="from"]'), toEl = row.querySelector('[data-field="to"]');
      var from = fromEl ? fromEl.value : '';
      var to = toEl ? toEl.value : '';
      writes.push({ range: 'Kategorie!' + colIndexToLetter(catCol) + sheetRow + ':' + colIndexToLetter(catCol + 1) + sheetRow,
        values: [[from, to]] });
    });
    pendingNewCategories.forEach(function(nc) {
      maxSheetRow++;
      localOverrides[nc.label] = { color: nc.color, display: nc.display || null };
      writes.push({ range: 'Kategorie!' + colIndexToLetter(catCol) + maxSheetRow + ':' + colIndexToLetter(catCol + 2) + maxSheetRow,
        values: [[nc.from != null ? nc.from : '', nc.to != null ? nc.to : '', nc.label]] });
    });
    saveCategoryColorOverrides_(localOverrides);
    if (!writes.length) {
      if (statusEl) statusEl.textContent = 'Uloženo (jen barvy kategorií bez řádku v listu).';
      pendingNewCategories = [];
      loadData();
      return;
    }
    fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: writes })
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
      return r.json();
    }).then(function() {
      pendingNewCategories = [];
      if (statusEl) statusEl.textContent = 'Uloženo.';
      loadData();
    }).catch(function(err) {
      if (statusEl) statusEl.textContent = 'Uložení selhalo: ' + err.message;

  }

  // One-time backfill: import a photo for every current player who doesn't have one
  // cached yet, then mark "FOTO PC" for whoever was found in a single batched write
  // (not one write per player). Newly added players going forward are handled
  // individually via toggleChecklistItem when "FOTO PC" is checked.
  function bulkImportAllPhotos() {
    if (!DATA || DATA.role !== 'admin') return;
    var statusEl = document.getElementById('bulkPhotoStatus');
    var players = DATA.players;
    var total = players.length;
    var done = 0, found = 0, alreadyHad = 0, notFound = 0;
    var toMark = [];
    function updateStatus() {
      if (statusEl) statusEl.textContent = 'Importuji fotky… ' + done + '/' + total + ' (nově nalezeno ' + found + ', nenalezeno ' + notFound + ')';
    }
    updateStatus();
    ensurePhotoIndex().then(function() {
      return new Promise(function(resolveAll) {
        var CONCURRENCY = 5;
        var nextIndex = 0;
        function worker() {
          var i = nextIndex++;
          if (i >= players.length) { if (done >= players.length) resolveAll(); return; }
          var p = players[i];
          if (p.photoDataUrl) {
            done++; alreadyHad++; updateStatus(); worker();
            return;
          }
          importPlayerPhoto(p, true, true).then(function(gotPhoto) {
            done++;
            if (gotPhoto) {
              found++;
              if (!p.checklist['FOTO PC']) {
                var colIdx = DATA.colIndex.checklistCols ? DATA.colIndex.checklistCols['FOTO PC'] : -1;
                if (colIdx != null && colIdx >= 0) {
                  toMark.push('Seznam!' + colIndexToLetter(colIdx) + p.sheetRow);
                  p.checklist['FOTO PC'] = true;
                }
              }
            } else {
              notFound++;
            }
            updateStatus();
            worker();
          });
        }
        for (var w = 0; w < Math.min(CONCURRENCY, players.length); w++) worker();
      });
    }).then(function() {
      if (!toMark.length) {
        if (statusEl) statusEl.textContent = 'Hotovo. Nově naimportováno ' + found + ' fotek, ' + alreadyHad + ' už bylo dřív, ' + notFound + ' nenalezeno.';
        pushNotification('Hromadný import fotek dokončen: ' + found + ' nových, ' + notFound + ' nenalezeno.', found ? 'info' : 'warn');
        return;
      }
      return fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: toMark.map(function(range) { return { range: range, values: [[true]] }; }) })
      }).then(function(r) {
        if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
        return r.json();
      }).then(function() {
        if (statusEl) statusEl.textContent = 'Hotovo. Nově naimportováno ' + found + ' fotek (checklist "FOTO PC" označen), ' + alreadyHad + ' už bylo dřív, ' + notFound + ' nenalezeno.';
        pushNotification('Hromadný import fotek dokončen: ' + found + ' nových (checklist aktualizován), ' + notFound + ' nenalezeno.', 'info');
      });
    }).catch(function(err) {
      if (statusEl) statusEl.textContent = 'Import selhal: ' + err.message;
      pushNotification('Hromadný import fotek selhal: ' + err.message, 'error');
    });
  }

  // ---------- Data normalization (KIS export style → sheet style) ----------
  // The KIS export and the "Seznam" sheet write the same kind of value in different shapes
  // (e.g. rodné číslo "191008/1349" in the export vs. a bare 1910081349 in the sheet, a phone
  // "+420 731 179 719" vs. a bare 731179719). These convert export → sheet style so an
  // imported row reads exactly like one Petr typed in by hand.
  function normalizeDigits_(v) {
    return (v == null ? '' : v.toString()).replace(/[^0-9]/g, '');
  }
  function normalizePhoneSheet_(v) {
    var d = normalizeDigits_(v);
    if (d.length === 12 && d.slice(0, 3) === '420') d = d.slice(3);
    return d;
  }
  function normalizePscSheet_(v) {
    return normalizeDigits_(v);
  }
  function normalizeRodneCisloSheet_(v) {
    return normalizeDigits_(v);
  }
  // Used only for the Google Contact's phone number (a different, human-dialable shape than
  // the bare digits kept in the sheet) — the sheet's own value is left exactly as normalized.
  // Coerced to a string up front: a pure-digit phone number written to Sheets without forcing
  // text comes back from the Sheets API as a JS number, not a string, and the People API
  // rejects a bare number for a text field ("Invalid value ... (TYPE_STRING)") — this makes the
  // function safe however the value comes in, without needing to fix the sheet cell itself.
  function formatPhoneForContact_(digitsOnly) {
    if (digitsOnly === null || digitsOnly === undefined || digitsOnly === '') return '';
    digitsOnly = String(digitsOnly);
    if (digitsOnly.length === 9) return '+420 ' + digitsOnly.slice(0, 3) + ' ' + digitsOnly.slice(3, 6) + ' ' + digitsOnly.slice(6);
    return digitsOnly;
  }
  function stripDiacritics_(s) {
    try { return s.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) { return s; }
  }
  function nameKey_(jmeno, prijmeni) {
    return stripDiacritics_((jmeno || '') + ' ' + (prijmeni || '')).toLowerCase().replace(/\s+/g, ' ').trim();
  }
  // A candidate is treated as "already known" (skip re-queueing it) if either its rodné číslo
  // matches an existing player/pending row, or its name + birth date do — covers both a
  // genuine re-registration and the same KIS export file being uploaded twice by mistake.
  function findExistingMatch_(candidate) {
    var key = nameKey_(candidate.jmeno, candidate.prijmeni);
    var rc = candidate.rodneCislo;
    function matches(p) {
      if (rc && p.rodneCislo && normalizeDigits_(p.rodneCislo) === rc) return true;
      return nameKey_(p.jmeno, p.prijmeni) === key && (p.datumNarozeni || '') === candidate.datumNarozeni;
    }
    var inRoster = (DATA.players || []).find(matches);
    if (inRoster) return { where: 'tabulce', player: inRoster };
    var inPending = (DATA.pending || []).filter(function(p) { return p.stav === 'Čeká'; }).find(matches);
    if (inPending) return { where: 'čekajících', player: inPending };
    return null;
  }

  function handleImportFile(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var statusEl = document.getElementById('importPreview');
    if (statusEl) statusEl.textContent = 'Načítám soubor…';
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        var candidates = rows.map(parseKisRow).filter(function(c) { return c.jmeno || c.prijmeni; });
        var fresh = [], skipped = [];
        candidates.forEach(function(c) {
          var m = findExistingMatch_(c);
          if (m) skipped.push({ c: c, m: m }); else fresh.push(c);
        });
        if (!fresh.length) {
          if (statusEl) statusEl.textContent = skipped.length ?
            ('Všech ' + skipped.length + ' záznamů už je v ' + (skipped[0].m.where) + ' — nic nového k přidání.') :
            'V souboru nebyly nalezeny žádné řádky k importu.';
          pushNotification('Soubor "' + file.name + '" načten — nic nového (' + skipped.length + ' už bylo dřív).', 'warn');
          e.target.value = '';
          return;
        }
        var today = formatDateCz_();
        var rowsToAppend = fresh.map(function(c) {
          // Leading apostrophe forces plain text — otherwise Sheets auto-detects "D.M.RRRR"
          // as a date and silently stores a date serial instead of the literal string.
          // Same reasoning for phone numbers: a bare digit string like "731179719" would
          // otherwise be auto-detected as a number, which later breaks Google Contacts creation
          // (the People API rejects a number where it expects a text phone value).
          return [c.jmeno, c.prijmeni, (c.datumNarozeni ? "'" + c.datumNarozeni : ''), c.rok, (c.rodneCislo ? "'" + c.rodneCislo : ''),
            c.emailHrac, (c.telefonHrac ? "'" + c.telefonHrac : ''), c.ulice, c.cp, c.mesto, c.psc,
            c.zastupceJmeno, c.zastupceEmail, (c.zastupceTelefon ? "'" + c.zastupceTelefon : ''),
            c.poznamka, c.zdravotniOmezeni, 'Čeká', today, '', file.name];
        });
        fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/' + encodeURIComponent(PENDING_SHEET + '!A1') + ':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ values: rowsToAppend })
        }).then(function(r) {
          if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
          return r.json();
        }).then(function() {
          var msg = fresh.length + ' nových záznamů čeká na kontrolu v Nastavení → Noví uživatelé.' +
            (skipped.length ? (' (' + skipped.length + ' už bylo dřív, přeskočeno.)') : '');
          if (statusEl) statusEl.textContent = msg;
          pushNotification('Soubor "' + file.name + '" načten — ' + msg, 'info');
          e.target.value = '';
          loadData();
        }).catch(function(err) {
          if (statusEl) statusEl.textContent = 'Uložení do fronty selhalo: ' + err.message;
          pushNotification('Import souboru "' + file.name + '" selhal: ' + err.message, 'error');
        });
      } catch (err) {
        if (statusEl) statusEl.textContent = 'Soubor se nepodařilo přečíst: ' + err.message;
        pushNotification('Import souboru "' + file.name + '" selhal: ' + err.message, 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function parseKisRow(row) {
    var jmeno = (row['Jméno'] || '').toString().trim();
    var prijmeni = (row['Příjmení'] || '').toString().trim();
    var birth = row['Datum narození'];
    var birthDate = (birth instanceof Date) ? birth : null;
    var rok = birthDate ? birthDate.getFullYear() : '';
    var rule = (birthDate && DATA && DATA.categoryRules) ? matchCategoryRule_(rok, DATA.categoryRules) : null;
    return {
      jmeno: jmeno,
      prijmeni: prijmeni,
      datumNarozeni: birthDate ? formatBirthDateCz_(birthDate) : (row['Datum narození'] || '').toString(),
      rok: rok,
      categoryPreview: rule ? rule.label : '(nezjištěno — zkontrolujte ročník v tabulce)',
      rodneCislo: normalizeRodneCisloSheet_(row['Rodné číslo']),
      emailHrac: (row['E-mail'] || '').toString().trim(),
      telefonHrac: normalizePhoneSheet_(row['Telefon']),

      zastupceEmail: (row['Rodič - E-mail'] || row['Rodič - e-mail'] || '').toString().trim(),
      zastupceTelefon: normalizePhoneSheet_(row['Rodič - telefon']),
      poznamka: (row['Poznámka'] || '').toString().trim(),
      zdravotniOmezeni: (row['Zdravotní omezení'] || '').toString().trim()
    };

  var pendingRowNotes_ = {};

    var rows = (DATA.pending || []).filter(function(p) { return p.stav === 'Čeká' || p.stav === 'Přidáno'; })

  function applyAddPendingUser_(sheetRow) {
    var p = (DATA.pending || []).find(function(x) { return x.sheetRow === sheetRow; });
    if (!p || !DATA.colIndex) return;
    var maxRow = DATA.players.reduce(function(m, x) { return Math.max(m, x.sheetRow); }, DATA.headerRowIdx + 1);
    var targetRow = maxRow + 1;
    var idx = DATA.colIndex;
    var dataArr = [];
    function put(colKey, value, forceText) {
      var colIdx = idx[colKey];
      if (colIdx == null || colIdx < 0 || value === '' || value == null) return;
      dataArr.push({ range: 'Seznam!' + colIndexToLetter(colIdx) + targetRow, values: [[forceText ? ("'" + value) : value]] });
    }
    put('prijmeni', p.prijmeni);
    put('jmeno', p.jmeno);
    // Force text — "D.M.RRRR" would otherwise be auto-detected as a date and stored as a
    // date serial instead of the literal string every other birth date in the sheet uses.
    put('datumNarozeni', p.datumNarozeni, true);
    put('rok', p.rok);
    put('rodneCislo', p.rodneCislo, true);
    put('ulice', p.ulice);
    put('cp', p.cp);
    put('mesto', p.mesto);
    put('psc', p.psc);
    put('emailHrac', p.emailHrac);
    // Force text — same reason as datumNarozeni/rodneCislo above: a bare digit string would
    // otherwise become a number in the sheet, which later breaks Google Contacts creation.
    put('telefonHrac', p.telefonHrac, true);
    put('zastupceJmeno', p.zastupceJmeno);
    put('zastupceTelefon', p.zastupceTelefon, true);
    put('zastupceEmail', p.zastupceEmail);
    put('datumPridani', formatDateCz_());
    var regKisCol = idx.checklistCols && idx.checklistCols['REG KIS'];
    if (regKisCol != null && regKisCol >= 0) {
      dataArr.push({ range: 'Seznam!' + colIndexToLetter(regKisCol) + targetRow, values: [[true]] });
    }
    var regKisDateCol = idx.checklistDateCols && idx.checklistDateCols['REG KIS'];
    if (regKisDateCol != null && regKisDateCol >= 0) {
      dataArr.push({ range: 'Seznam!' + colIndexToLetter(regKisDateCol) + targetRow, values: [[formatDateCz_()]] });
    }
    if (!dataArr.length) return;

    fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: dataArr })
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
      return r.json();
    }).then(function() {
      var pIdx = DATA.pendingColIndex;
      var pdataArr = [{ range: PENDING_SHEET + '!' + colIndexToLetter(pIdx.stav) + p.sheetRow, values: [['Přidáno']] }];
      if (pIdx.datumVyrizeni != null && pIdx.datumVyrizeni >= 0) {
        pdataArr.push({ range: PENDING_SHEET + '!' + colIndexToLetter(pIdx.datumVyrizeni) + p.sheetRow, values: [[formatDateCz_()]] });
      }
      return fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: pdataArr })
      });
    }).then(function() {
      pushNotification('Hráč ' + p.jmenoCele + ' přidán do tabulky (řádek ' + targetRow + '). Zkontrolujte prosím FAČR ID a kategorii přímo v tabulce.', 'info');
      return createContactsForPendingUser_(p);
    }).then(function(contactSummary) {
      pendingRowNotes_[p.sheetRow] = contactSummary || 'Google kontakty: nebylo co vytvořit (chybí jméno nebo kontaktní údaje).';
      pushNotification(pendingRowNotes_[p.sheetRow], /selhal/.test(pendingRowNotes_[p.sheetRow]) ? 'warn' : 'info');
      loadData();
    }).catch(function(err) {
      pushNotification('Přidání hráče ' + p.jmenoCele + ' selhalo: ' + err.message, 'error');
    });
  }

  // Lets Petr retry Google-contact creation for a player already added to the sheet, without

  // ---------- Google Contacts (People API) ----------
  // Contact groups are looked up once per page load and cached in localStorage — creating a
  // handful of new players a year doesn't need a fresh lookup every time.
  var CONTACT_GROUP_CACHE_KEY = 'fks_contact_group_ids_v1';
  var CONTACT_GROUP_NAMES = { hraci: 'FK Slovany - Hráči', rodice: 'FK Slovany - Rodiče' };
  function loadContactGroupCache_() {
    try { return JSON.parse(localStorage.getItem(CONTACT_GROUP_CACHE_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveContactGroupCache_(map) {
    try { localStorage.setItem(CONTACT_GROUP_CACHE_KEY, JSON.stringify(map)); } catch (e) {}
  }
  function ensureContactGroup_(name) {
    var cache = loadContactGroupCache_();
    if (cache[name]) return Promise.resolve(cache[name]);
    return fetch('https://people.googleapis.com/v1/contactGroups?pageSize=200', {
      headers: { 'Authorization': 'Bearer ' + accessToken }
    }).then(function(r) { return r.json(); }).then(function(j) {
      var found = (j.contactGroups || []).find(function(g) { return g.name === name || g.formattedName === name; });
      if (found) { cache[name] = found.resourceName; saveContactGroupCache_(cache); return found.resourceName; }
      return fetch('https://people.googleapis.com/v1/contactGroups', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ contactGroup: { name: name } })
      }).then(function(r) {
        if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
        return r.json();
      }).then(function(created) {
        cache[name] = created.resourceName;
        saveContactGroupCache_(cache);
        return created.resourceName;
      });
    });
  }
  function createContact_(fullName, email, phone, groupResourceName) {
    var spaceIdx = fullName.indexOf(' ');
    var givenName = spaceIdx === -1 ? fullName : fullName.slice(0, spaceIdx);
    var familyName = spaceIdx === -1 ? '' : fullName.slice(spaceIdx + 1);
    var body = { names: [{ givenName: givenName, familyName: familyName }] };
    if (email) body.emailAddresses = [{ value: email }];
    if (phone) body.phoneNumbers = [{ value: phone }];
    if (groupResourceName) body.memberships = [{ contactGroupMembership: { contactGroupResourceName: groupResourceName } }];
    return fetch('https://people.googleapis.com/v1/people:createContact', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
      return r.json();
    });
  }
  // Creates a contact for the player (if a name is present) and, separately, for the
  // guardian (only if any guardian field was actually filled in) — each into its own group.
  // Failures here are reported but don't roll back the sheet write, since the player is
  // already correctly in "Seznam" at that point either way.
  function createContactsForPendingUser_(p) {
    var jobs = [];
    var results = [];
    if (p.jmenoCele) {
      jobs.push(
        ensureContactGroup_(CONTACT_GROUP_NAMES.hraci)
          .then(function(gid) { return createContact_(p.jmenoCele, p.emailHrac, formatPhoneForContact_(p.telefonHrac), gid); })
          .then(function() { results.push('hráč'); })
          .catch(function(err) { results.push('hráč selhal: ' + err.message); })
      );
    }
    if (p.zastupceJmeno || p.zastupceEmail || p.zastupceTelefon) {
      jobs.push(
        ensureContactGroup_(CONTACT_GROUP_NAMES.rodice)
          .then(function(gid) { return createContact_(p.zastupceJmeno || (p.jmenoCele + ' - zástupce'), p.zastupceEmail, formatPhoneForContact_(p.zastupceTelefon), gid); })
          .then(function() { results.push('zástupce'); })
          .catch(function(err) { results.push('zástupce selhal: ' + err.message); })
      );
    }
    if (!jobs.length) return Promise.resolve(null);
    return Promise.all(jobs).then(function() {
      return 'Google kontakty: ' + results.join(', ') + '.';
    });
  }

  function fetchEmailTemplate_() {

  // Writes the template into the "Email" tab, creating that tab first if this is the very
  // first save (mirrors how "Čekající" was created — never assumed to already exist).
  function saveEmailTemplate_(predmet, telo) {
    var payload = { valueInputOption: 'RAW', data: [
      { range: EMAIL_SHEET + '!A1:B2', values: [['Předmět', predmet], ['Tělo', telo]] }
    ] };
    function doUpdate() {
      return fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values:batchUpdate', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }
    return doUpdate().then(function(r) {
      if (r.ok) return r.json();
      return r.json().then(function(err) {
        var msg = (err.error && err.error.message) || ('HTTP ' + r.status);
        if (msg.toLowerCase().indexOf('unable to parse range') === -1) throw new Error(msg);
        return fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + ':batchUpdate', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ requests: [{ addSheet: { properties: { title: EMAIL_SHEET } } }] })
        }).then(function(r2) {
          if (!r2.ok) return r2.json().then(function(e2) { throw new Error((e2.error && e2.error.message) || ('HTTP ' + r2.status)); });
          return doUpdate();
        }).then(function(r3) {
          if (!r3.ok) return r3.json().then(function(e3) { throw new Error((e3.error && e3.error.message) || ('HTTP ' + r3.status)); });
          return r3.json();
        });
      });
    });
  }

  function loadWelcomeFolderCache_() {
    try { return JSON.parse(localStorage.getItem(WELCOME_FOLDER_CACHE_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveWelcomeFolderCache_(obj) {

  }
  // Finds the Drive folder by name (not a hardcoded ID, since Petr asked the app to locate it
  // itself) and lists its files, caching the result in this browser so repeated sends don't
  // re-search every time. Pass forceRefresh=true to bypass the cache (e.g. if he adds a file).
  function findWelcomeFolderFiles_(forceRefresh) {
    var cached = !forceRefresh && loadWelcomeFolderCache_();
    if (cached && cached.files && cached.files.length) return Promise.resolve(cached.files);
    return fetch('https://www.googleapis.com/drive/v3/files?q=' +
      encodeURIComponent("name contains 'úvodního' and mimeType = 'application/vnd.google-apps.folder' and trashed = false") +
      '&fields=' + encodeURIComponent('files(id,name)'), { headers: { 'Authorization': 'Bearer ' + accessToken } })
      .then(function(r) { return r.json(); })
      .then(function(json) {
        var folder = (json.files || [])[0];
        if (!folder) throw new Error('Složka "' + WELCOME_FOLDER_NAME + '" nebyla na Disku nalezena.');
        return fetch('https://www.googleapis.com/drive/v3/files?q=' +
          encodeURIComponent("'" + folder.id + "' in parents and trashed = false") +
          '&fields=' + encodeURIComponent('files(id,name)'), { headers: { 'Authorization': 'Bearer ' + accessToken } })
          .then(function(r2) { return r2.json(); })
          .then(function(json2) {
            var files = json2.files || [];
            if (!files.length) throw new Error('Složka "' + WELCOME_FOLDER_NAME + '" na Disku byla nalezena, ale je prázdná.');
            saveWelcomeFolderCache_({ folderId: folder.id, files: files });
            return files;
          });
      });
  }
  function guessMimeType_(filename) {
    var ext = (filename.split('.').pop() || '').toLowerCase();
    var map = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif' };
    return map[ext] || 'application/octet-stream';
  }
  function bytesToBase64_(bytes) {
    var binary = '';
    var chunkSize = 0x8000;
    for (var i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }
  function utf8ToBase64_(str) {
    return bytesToBase64_(new TextEncoder().encode(str));
  }
  function wrapBase64_(b64) {
    return b64.replace(/(.{76})/g, '$1\r\n');
  }
  function toBase64Url_(b64) {
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  // RFC 2047 "B" encoding — needed because the subject line has Czech diacritics, which a bare
  // header would mangle in some mail clients.
  function encodeMimeHeader_(str) {
    return '=?UTF-8?B?' + utf8ToBase64_(str) + '?=';
  }
  // ---------- Tiny markdown-lite for the email body ----------
  // The template box in Nastavení is a plain textarea, so formatting is done with a handful of
  // markdown-style markers instead of a rich-text editor: **tučně**, *kurzívou*, and any bare
  // http(s):// URL is turned into a clickable link automatically. Kept deliberately tiny (no
  // lists, no nested markup) so both directions (render for preview/send, strip for the
  // plain-text fallback part of the e-mail) stay simple and predictable.
  function markdownLiteToHtml_(text) {
    var h = esc(text);
    h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    h = h.replace(/\*(.+?)\*/g, '<i>$1</i>');
    h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" style="color:#0b57d0;">$1</a>');
    h = h.replace(/\n/g, '<br>');
    return h;
  }
  function stripMarkdownLite_(text) {
    return text.replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(.+?)\*/g, '$1');
  }
  // Assembles a raw RFC 2822 message (multipart/mixed containing a multipart/alternative
  // text+HTML body plus the attachment parts) and returns it base64url-encoded, exactly the
  // shape Gmail's users.messages.send expects in its "raw" field. The HTML part is what gives
  // the e-mail working links and bold/italic; the plain-text part is just a fallback for mail
  // clients that don't render HTML.
  function buildRawEmail_(from, to, subject, bodyRaw, attachments) {
    var mixedBoundary = 'fks_mixed_' + Date.now().toString(36);
    var altBoundary = 'fks_alt_' + Date.now().toString(36) + 'a';
    var plainText = stripMarkdownLite_(bodyRaw);
    var bodyHtml = '<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#111;">' + markdownLiteToHtml_(bodyRaw) + '</div>';
    var lines = [];
    lines.push('From: ' + from);
    lines.push('To: ' + to);
    lines.push('Subject: ' + encodeMimeHeader_(subject));
    lines.push('MIME-Version: 1.0');
    lines.push('Content-Type: multipart/mixed; boundary="' + mixedBoundary + '"');
    lines.push('');
    lines.push('--' + mixedBoundary);
    lines.push('Content-Type: multipart/alternative; boundary="' + altBoundary + '"');
    lines.push('');
    lines.push('--' + altBoundary);
    lines.push('Content-Type: text/plain; charset="UTF-8"');
    lines.push('Content-Transfer-Encoding: base64');
    lines.push('');
    lines.push(wrapBase64_(utf8ToBase64_(plainText)));
    lines.push('--' + altBoundary);
    lines.push('Content-Type: text/html; charset="UTF-8"');
    lines.push('Content-Transfer-Encoding: base64');
    lines.push('');
    lines.push(wrapBase64_(utf8ToBase64_(bodyHtml)));
    lines.push('--' + altBoundary + '--');
    attachments.forEach(function(att) {
      lines.push('--' + mixedBoundary);
      lines.push('Content-Type: ' + att.mimeType + '; name="' + att.name + '"');
      lines.push('Content-Disposition: attachment; filename="' + att.name + '"');
      lines.push('Content-Transfer-Encoding: base64');
      lines.push('');
      lines.push(wrapBase64_(att.base64));
    });
    lines.push('--' + mixedBoundary + '--');
    return toBase64Url_(utf8ToBase64_(lines.join('\r\n')));
  }
  // Downloads the 4 attachment files fresh every send (small PDFs/JPG, not worth caching the
  // bytes) and posts the assembled message via the Gmail API under Petr's own OAuth token.
  function sendWelcomeEmail_(p) {
    var to = (p.zastupceEmail || p.emailHrac || '').trim();
    if (!to) return Promise.reject(new Error('Chybí e-mail zástupce i hráče, není kam poslat.'));
    return Promise.all([fetchEmailTemplate_(), findWelcomeFolderFiles_()]).then(function(results) {
      var tmpl = results[0];
      var files = results[1];
      return Promise.all(files.map(function(f) {
        return fetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media', { headers: { 'Authorization': 'Bearer ' + accessToken } })
          .then(function(r) { if (!r.ok) throw new Error('Nepodařilo se stáhnout přílohu "' + f.name + '".'); return r.arrayBuffer(); })
          .then(function(buf) { return { name: f.name, mimeType: guessMimeType_(f.name), base64: bytesToBase64_(new Uint8Array(buf)) }; });
      })).then(function(attachments) {
        var raw = buildRawEmail_(FROM_EMAIL, to, tmpl.predmet, tmpl.telo, attachments);
        return fetch('https://www.googleapis.com/gmail/v1/users/me/messages/send', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ raw: raw })
        }).then(function(r) {
          if (!r.ok) return r.json().then(function(err) { throw new Error((err.error && err.error.message) || ('HTTP ' + r.status)); });
          return r.json();
        });
      });
    });
  }

  // Tracks what was last rendered into #main so a genuine navigation (list → detail, list →

  var lastRenderKey = null;
  function render() {

    var isNavigation = renderKey !== lastRenderKey;
    lastRenderKey = renderKey;
    if (state.view === 'detail') {
      main.innerHTML = renderDetailView();
      // The fill is rendered at width:0 on purpose — flipping it to its real value one frame
      // later (after the browser has painted the 0% state) is what makes the CSS transition on
      // .detail-progress-fill actually animate, instead of just appearing already full.
      var fillEl = document.getElementById('detailProgressFill');
      if (fillEl) {
        var targetPct = fillEl.getAttribute('data-pct');
        requestAnimationFrame(function() { requestAnimationFrame(function() { fillEl.style.width = targetPct + '%'; }); });
      }
    }
    else if (state.view === 'map') { main.innerHTML = renderMapView(); }
    else if (state.view === 'settings') { main.innerHTML = renderSettingsView(); wireSettingsView(); }
    else if (state.view === 'vyrazeni') { main.innerHTML = renderVyrazeniView(); }
    else { main.innerHTML = renderListView(); }
    // Must run AFTER the innerHTML swap above, not before: #main keeps its old scrollTop across
    // an innerHTML replacement (the browser only clamps it to the new content's height, it
    // doesn't zero it), which is exactly what made a detail card open already scrolled down
    // when it was opened from far down a long, scrolled list.
    if (isNavigation) main.scrollTop = 0;

    // Sdílet/Filtr/Zrušit filtr/Aktualizovat and the category chips only make sense against
    // the player list — hide them on the player detail card and on Nastavení (and close any
    // panel left open from the list view).
    var hideSidebarChrome = (state.view === 'detail' || state.view === 'settings');
    var sidebarToolsEl = document.querySelector('.sidebar-tools');
    if (sidebarToolsEl) {
      sidebarToolsEl.style.display = hideSidebarChrome ? 'none' : 'grid';
      if (hideSidebarChrome) {
        ['sharePanel', 'filterPanel', 'sortPanel'].forEach(function(id) {
          var p = document.getElementById(id);
          if (p) p.style.display = 'none';
        });
      }
    }
    var catListEl = document.getElementById('catList');
    if (catListEl) catListEl.style.display = (state.view === 'settings') ? 'none' : '';
    var selectModeBtnEl = document.getElementById('selectModeBtn');
    if (selectModeBtnEl) selectModeBtnEl.classList.toggle('active', state.selectMode);
    updateSettingsBadge_();

    // Note: the Filtr/Sdílet dropdown panels are deliberately NOT re-rendered here on every
    // render() call — rebuilding the search <input> on each keystroke would reset its cursor
    // position/focus. They're (re)built once when opened (toggleSidebarPanel) and refreshed
    // only when their own controls change.
    if (document.getElementById('sharePanel') && document.getElementById('sharePanel').style.display === 'block') renderSharePanel();
    if (state.view === 'map') {
      var myRenderToken = ++mapLoadToken;
      initMapIfNeeded().then(function() {
        if (myRenderToken !== mapLoadToken) return; // a newer render superseded this one
        plotPlayersOnMap(filteredPlayers());
      }).catch(function() {
        var statusEl = document.getElementById('mapStatus');
        if (statusEl) statusEl.textContent = 'Mapu se nepodařilo načíst. Zkuste to prosím znovu.';
      });
    }
  }

  function renderCatList() {
    // "Vše" is active exactly when nothing else is selected; every other chip can be
    // toggled on/off independently, so several categories (e.g. U11 + U12) can show at once.
    var html = '<div class="cat-item' + (state.categories.length === 0 ? ' active' : '') + '" data-cat="Vše"><span class="dot" style="background:#5a6169"></span>Vše</div>';
    html += DATA.categoryRules.filter(function (r) { return !r.hideFilter; }).slice().sort(function(a, b) {
      return categoryOrderWeight_(a.label) - categoryOrderWeight_(b.label) || (a.label || '').localeCompare(b.label || '', 'cs');
    }).map(function (r) {
      return '<div class="cat-item' + (state.categories.indexOf(r.label) !== -1 ? ' active' : '') + '" data-cat="' + esc(r.label) + '">' +
        '<span class="dot" style="background:' + esc(r.color) + '"></span>' + esc(displayCategoryLabel(r.label)) + '</div>';
    }).join('');
    html += '<div class="cat-item" data-cat="__vyrazeni__"><span class="dot" style="background:#5a6169"></span>Vyřazení hráči</div>';
    var el = document.getElementById('catList');
    el.innerHTML = html;
    Array.prototype.forEach.call(el.children, function(child) {
      child.addEventListener('click', function() {
        var cat = child.getAttribute('data-cat');
        if (cat === '__vyrazeni__') { openVyrazeni(); return; }
        if (cat === 'Vše') {
          state.categories = [];
        } else {
          var i = state.categories.indexOf(cat);
          if (i === -1) state.categories.push(cat); else state.categories.splice(i, 1);
        }
        // Stay on the map if the map is already open (so picking a category re-filters
        // the markers in place); only detail view kicks back to the list.
        if (state.view === 'detail') state.view = 'list';
        renderCatList();
        render();
      });
    });
  }

  var modalOverlayEl = document.getElementById('modalOverlay');
  if (modalOverlayEl) {
    modalOverlayEl.addEventListener('click', function(e) { if (e.target === modalOverlayEl) closeModal(); });
  }
  document.addEventListener('click', function(e) {
    if (notifPanelOpen) {
      var panel = document.getElementById('notifPanel');
      var btn = e.target.closest ? e.target.closest('[onclick="toggleNotifications()"]') : null;
      if (panel && !panel.contains(e.target) && !btn) { notifPanelOpen = false; panel.style.display = 'none'; }
    }
    ['sharePanel', 'filterPanel'].forEach(function(id) {
      var panel = document.getElementById(id);
      if (!panel || panel.style.display !== 'block') return;
      // focusSearch() (the magnifying-glass icon) also opens the Filtr panel, on the same
      // click — without recognizing it here too, this handler saw that click as "outside"
      // the panel and closed it again immediately, undoing the open on the very same click.
      var isTriggerBtn = e.target.closest && e.target.closest('[onclick*="toggleSidebarPanel"], [onclick="focusSearch()"]');
      if (!panel.contains(e.target) && !isTriggerBtn) panel.style.display = 'none';
    });
  });

  function fillSelect(id, values, selected) {
    var el = document.getElementById(id);
    el.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = 'Vše'; allOpt.textContent = (id.toLowerCase().indexOf('rok') !== -1 ? 'Ročník: Vše' : 'Obec: Vše');
    el.appendChild(allOpt);
    values.forEach(function(v) {
      var opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      el.appendChild(opt);
    });
    el.value = selected;
  }
</script>
</body>
</html>
